tables:
  input: director_decisions   # decision + prediction enter here (no app write surface exists on jicate/main — creation is DB-level; RLS insert_self allows the director persona itself)
  action: director_decisions  # SAME table: the verdict IS the action (actual_outcome_value, prediction_correct, verdict_notes); notification sink = notifications + user_notifications

# Measure fn EXISTS (registry gates.m='on' confirmed in pg_proc:
# fn_decision_outcome_check() + fn_decision_resolve_metric(text,jsonb,tstz)
# RETURNS (actual numeric, correct boolean, notes text, handled boolean)),
# so a sim block is warranted. DESIGNED FROM VERIFIED SCHEMA, NOT YET RUN.
sim:
  sentinel: ZZAUDIT
  # Determinism comes from INSTITUTION SCOPING: outcome_metric_query.institution_id
  # filters admission_funnel_conversion_rate to ONLY the sentinel institution's
  # leads (fn_decision_resolve_metric: `v_institution_id IS NULL OR
  # institution_id = v_institution_id`). admission_leads.institution_id has a
  # REAL FK -> institutions (ON DELETE CASCADE), so a sentinel institution row
  # must be seeded first (institutions' only required no-default column: name).
  # admission_leads NOT-NULLs: institution_id, phone, source (enum lead_source,
  # default 'website'), funnel_stage (ENUM, default 'new'; 'enrolled' is a
  # verified label), first_name, gate_entry_count (default 0).
  # Verdict window = [due_at-30d, due_at); baseline window = the 30d before that
  # (leave it empty -> baseline 0, irrelevant for absolute_gte).
  seed_input: |
    WITH inst AS (
      INSERT INTO public.institutions (name) VALUES ('ZZAUDIT Institution') RETURNING id
    ), leads AS (
      INSERT INTO public.admission_leads (institution_id, phone, first_name, funnel_stage, created_at)
      SELECT inst.id, 'ZZAUDIT-' || g::text, 'ZZAUDIT',
             CASE WHEN g = 1 THEN 'enrolled'::funnel_stage ELSE 'new'::funnel_stage END,
             now() - interval '10 days'
      FROM inst, generate_series(1,4) g
      RETURNING institution_id
    )
    INSERT INTO public.director_decisions
      (director_user_id, title, context, alternatives, chosen_alternative_idx,
       predicted_outcome, outcome_metric_query, outcome_due_at, status)
    SELECT '1d35bef2-2b62-4f64-b2d0-196eb8047fac',  -- test.superadmin profile id (verified in profiles 2026-07-13); FK -> profiles(id)
           'ZZAUDIT sim decision', 'moat-audit sim seed',
           '[{"label":"A"},{"label":"B"}]'::jsonb, 0,
           'sentinel conversion >= 50%',
           jsonb_build_object(
             'metric','admission_funnel_conversion_rate',
             'institution_id', (SELECT institution_id FROM leads LIMIT 1)::text,
             'comparison','absolute_gte','target_value','50'),
           now() - interval '1 hour', 'pending_outcome';
  seed_action: |
    -- Not applicable for this loop: the "action" columns (actual_outcome_value,
    -- prediction_correct) live on the SAME director_decisions row seeded above
    -- and are written by the verifier itself. Nothing to backdate.
    SELECT 1;
  verifier: "public.fn_decision_outcome_check()"
  asserts:
    # Assert ONLY on the sentinel row's columns, NEVER on the fn's integer
    # return (it also touches the real due TBD row — see notes).
    # 1 enrolled / 4 total -> ROUND(100.0*1/4, 2) = 25.00 < target 50.
    no_change: "25.00"    # SELECT actual_outcome_value FROM director_decisions WHERE title='ZZAUDIT sim decision' => 25.00, prediction_correct=false, status='outcome_recorded'
    known_delta: { seed: "UPDATE 2 more ZZAUDIT leads to funnel_stage='enrolled' (3/4 enrolled)", expect: "75.00" }  # prediction_correct flips to true (75.00 >= 50)
  reset_between_deltas: |
    UPDATE public.director_decisions
    SET status='pending_outcome', actual_outcome_value=NULL,
        actual_outcome_recorded_at=NULL, prediction_correct=NULL, verdict_notes=NULL
    WHERE title = 'ZZAUDIT sim decision';
  notes:
    - DESIGNED-NOT-RUN — this discovery pass was read-only; first regress run
      must confirm the 25.00/75.00 asserts and append its receipt here.
    - verifier grades ALL due pending rows (LIMIT 100), including the REAL
      TBD_AT_VERDICT_TIME row 013f2f58 (appends verdict_notes) and, from
      2026-07-25, the real Q3 decision cf962133 — inside BEGIN..ROLLBACK this
      is harmless; NEVER run the verifier on committed data in a sim.
    - verifier also inserts notifications + user_notifications work-item rows
      per graded decision — rolled back with everything else.
    - admission_leads INSERT fires triggers (fn_auto_assign_counselor_v3,
      update_counselor_current_leads, attribution/learner syncs, stage-change
      log — verified pg_trigger). They roll back too, but if one RAISES, the
      seed fails — that is a finding to report, not a reason to disable
      triggers on prod.
    - funnel_stage and source are ENUMs — use real labels ('enrolled','new');
      an invented label errors (match-real-vocabulary memory).
    - outcome_metric_query values target_value/institution_id are parsed with
      NULLIF(x,'')::NUMERIC/UUID — pass them as strings in the JSONB.
    - TBD_AT_VERDICT_TIME in formula, and composite {metrics:[...]} queries,
      take DIFFERENT code paths (manual-verdict work item / all_must_hit-vs-
      any_must_hit) — this sim covers the single-metric path only.
    - asserts derive from THIS loop's SQL (ROUND(...,2) numeric) — never carry
      SCF's 0.00/2.00 here.

confound:
  # outcome column (actual_outcome_value) + verdict column (prediction_correct)
  # both exist on director_decisions, so the block is warranted — but the
  # causal question for an ACCOUNTABILITY loop is calibration-over-time (does
  # the Director's hit-rate improve as verdicts accumulate?), not
  # tried-vs-not_tried. Fuel check 2026-07-13: only 2 graded rows (both
  # prediction_correct=false) => report unmeasurable-no-fuel, don't conclude.
  verdict_column: prediction_correct
  query: |
    SELECT date_trunc('quarter', decision_made_at)::date AS quarter,
           count(*) FILTER (WHERE status = 'outcome_recorded')          AS graded,
           count(*) FILTER (WHERE prediction_correct IS TRUE)           AS correct,
           count(*) FILTER (WHERE prediction_correct IS FALSE)          AS wrong,
           count(*) FILTER (WHERE status = 'pending_outcome')           AS pending
    FROM director_decisions
    GROUP BY 1 ORDER BY 1;
  min_rows: 10

