walk:
  personas:
    superadmin: test.superadmin@jkkn.ac.in   # profile 1d35bef2-2b62-4f64-b2d0-196eb8047fac (verified); MUST be the sentinel row's director_user_id or RLS hides everything (select_self policy)
  # No decision-entry page exists on jicate/main, so hop 1 is a COMMITTED
  # DB-level seed (RLS insert_self permits the persona to insert its own row
  # via authenticated PostgREST; Mgmt-API service-role seed is equivalent).
  # Zero-substrate determinism trick for the walk: outcome_metric_query
  # .institution_id = a RANDOM uuid (jsonb only — no FK) => the metric scans 0
  # leads => actual = 0 (CASE WHEN total=0 THEN 0), target_value '0' +
  # absolute_gte => prediction_correct = TRUE. No admission_leads writes on
  # committed prod data at all.
  hops:
    - { as: superadmin, do: db_seed_committed,
        detail: "INSERT sentinel director_decisions row: director_user_id=<superadmin profile id>, title='ZZAUDIT walk decision', outcome_due_at=now()-1h, outcome_metric_query={metric:'admission_funnel_conversion_rate', institution_id:'<random uuid>', comparison:'absolute_gte', target_value:'0'}",
        assert_db: "1 pending_outcome row, title='ZZAUDIT walk decision'" }
    - { as: cron, do: api_get, path: /api/dashboard/cron/decisions-verdict-check,
        detail: "Bearer CRON_SECRET (known-secret-via-localhost pattern if prod secret unavailable)",
        assert: "http 200, ok:true, graded >= 1" }
    - { as: superadmin, do: db_assert,
        detail: "sentinel row status='outcome_recorded', prediction_correct=true, actual_outcome_value=0; notifications row idempotency_key='decision_verdict:<id>:<due YYYY-MM-DD>' + its user_notifications fan-out row targeted to the superadmin profile" }
    - { as: superadmin, do: open_assert, page: /dashboard,
        expect: "decision queue (approvals) shows 'Verdict: CORRECT — ZZAUDIT walk decision' work item" }
    - { as: superadmin, do: open_assert, page: /admin/loops,
        expect: "decisions loop card fuel count includes the graded row (super_admin-only route; NOTE the card's 'graded' count is the always-0 status-vocabulary bug — do not treat that 0 as a walk failure)" }
  forbidden:
    - ANY write to the real Director's rows (director_user_id b2bcb548-6b4c-4c75-a6b3-72dd5e9a94f1) — never touch their status/due dates/notifications.
    - UNAVOIDABLE-BUT-DISCLOSE — a committed cron run ALSO re-touches the real
      due TBD row 013f2f58 (one verdict_notes append; its work-item is deduped
      by idempotency key). Show this in the hop plan and get explicit go.
    - From 2026-07-25 the real Q3 decision cf962133 becomes due — a walk cron
      trigger would grade a REAL decision earlier than its natural 04:00 UTC
      run. Flag before running; prefer walking before that date or after the
      natural run has already graded it.
  cleanup: |
    DELETE FROM user_notifications WHERE notification_id IN
      (SELECT id FROM notifications WHERE title LIKE '%ZZAUDIT%');
    DELETE FROM notifications WHERE title LIKE '%ZZAUDIT%';
    DELETE FROM director_decisions WHERE title LIKE 'ZZAUDIT%';
    -- verify in a SEPARATE call (delete-then-count in one statement sees the
    -- pre-delete snapshot): ZZAUDIT counts = 0 in all three tables AND
    -- director_decisions total restored (4 as of 2026-07-13).

