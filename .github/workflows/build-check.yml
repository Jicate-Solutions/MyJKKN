name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Check admission-counselor membership contract
        run: npm run check:admission-counselor-membership

      - name: Check bug-module classifier parity
        # Verifies bug_reports.module_name CASE in supabase/setup/01_tables.sql
        # covers every slug in MODULES (lib/navigation/modules.ts). Without this,
        # adding a new top-level module silently misclassifies its bugs as 'other'.
        # See scripts/check-bug-module-classifier.mjs header for the full diagnostic
        # and the 2026-05-05 audit that surfaced 22 missing slugs / 1,201 mis-tagged bugs.
        run: node scripts/check-bug-module-classifier.mjs
