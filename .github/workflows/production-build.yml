name: Production Build (PR checks)

# The cheap, PR-scoped half of this repository's production-build gate.
#
# ── R16 (Director ruling, 2026-09-18): THE HEAVY BUILD LEFT THIS FILE ──────────
#
# Until today this file also ran the real `npm run build:ci` on every pull
# request. Since 2026-09-16 GitHub has been giving this repository 2-vCPU /
# 7.8 GB runners instead of the 4-vCPU / 15 GiB boxes that build was measured on,
# and a ~13 GB `next build` cannot finish on them: it died on pull requests that
# were perfectly fine. A per-PR gate that always fails is worse than no gate — it
# teaches everybody to read a red mark as noise.
#
# So the build job moved, unchanged in substance, to
# .github/workflows/production-build-main.yml, where it now runs on `push` to
# `main` (after each merge) and on `workflow_dispatch`. Its entire measurement
# record — the swap sizing from PR #3856, the memory traces, the two wrong
# hypotheses that came before the right one — moved with it, because it documents
# that job and nothing that is left here. A red main is surfaced by that file's
# `red-main` job, which keeps ONE issue titled "Production Build on main is red"
# open for as long as main does not build.
#
# What stayed here is everything cheap and genuinely about the pull request:
#
#   • The relevance filter's own test suite (scripts/ci/build-relevance.test.sh).
#     The filter decides whether a diff can change the output of `next build`,
#     and its first version shipped a false green, so it is tested on every PR
#     that touches it. Pure bash and git against a scratch repo — no npm install,
#     no compile.
#   • The `build:ci` vs `build` parity check
#     (scripts/ci/check-build-ci-parity.mjs). `build:ci` is a deliberate
#     duplicate of `build` with a lower V8 heap cap. Duplicates drift, and this
#     fails the moment they do — which matters MORE now that the build itself
#     only runs after the merge.
#
# Neither job compiles anything, so neither is affected by the runner size; both
# finish in well under a minute.
#
# Branch protection is untouched by the move: "Production Build" was never one of
# main's required status checks (verified 2026-09-18 — that list is the three
# migration-version contexts plus TypeCheck (PR-scoped)), so nothing that used to
# block a merge stops blocking one.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Inert until the merge queue is enabled on this repo, then it catches the
  # "two green PRs break when combined" class against the queue's merged tree.
  # Mirrors typecheck-pr-scoped.yml.
  merge_group:
    types: [checks_requested]


permissions:
  contents: read

concurrency:
  # Both jobs here are seconds long, so this is about tidiness rather than cost:
  # on a branch being pushed to repeatedly, the older runs are answering a
  # question nobody is asking any more.
  group: production-build-pr-checks-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Matches the self-test job the other gates in this repo carry
  # (secdef-anon-revoke.yml, ungrantable-permissions.yml, typecheck-pr-scoped.yml).
  #
  # It exists because the relevance filter's FIRST version was tested — with two
  # fixtures, "docs-only -> 0" and "mixed code -> 3". Both were Added/Modified
  # files, and the filter said `--diff-filter=AM`, so the tests exercised only
  # paths that already passed and the gate shipped blind to deletions and
  # renames. A fixture set that proves only the happy path is how a broken gate
  # stays green. Every "-> build" case in the suite is one the old filter got
  # wrong.
  #
  # Cheap: pure bash and git against a scratch repo, no npm install, no build.
  self-test:
    name: The build gate's own tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Test the relevance filter
        run: bash scripts/ci/build-relevance.test.sh

      # The build job runs `build:ci`, a deliberate duplicate of `build` with a
      # lower heap cap. Duplicates drift; this fails the moment they do, rather
      # than letting the gate keep reporting green while compiling something
      # that is no longer what Vercel compiles.
      - name: build:ci still matches build
        run: node scripts/ci/check-build-ci-parity.mjs
