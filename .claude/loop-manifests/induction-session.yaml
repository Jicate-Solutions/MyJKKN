# Induction Session-Effectiveness loop manifest — discovery pass 2026-07-13.
# Every table/column/function below verified against prod (Mgmt API,
# information_schema + pg_proc) and jicate/main (git show) on 2026-07-13.
# NOT yet run as an executable sim — the sim block is a designed recipe from the
# verified verifier body (20260629160000_induction_session_effectiveness_loop.sql),
# not a replayed one. First /loops regress run should confirm the asserts, then
# promote this comment.
loop_key: induction-session
name: Induction Session-Effectiveness Loop
prod_ref: kvizhngldtiuufknvehv

# Loop shape (verified from jicate/main:app/api/cron/induction-session-effectiveness/route.ts):
#   detect weak topic (first batch run avg < 3.5 with >= 3 ratings)
#   -> AI tip (fn_induction_record_session_tip)
#   -> speaker sees tip (SessionLoopTipCard on /learners/my-induction) before Batch B
#   -> RTM-corrected verifier scores the re-run net of regression-to-the-mean
#      (fn_induction_measure_session_effectiveness).
# Cadence: cron "43 */4 * * *" (vercel.json, verified), routine_id
# induction-session-effectiveness (lib/ai-routines/induction-ai.ts), Max-lane
# twin may defer the cloud run (shouldDeferToMaxLane in the route).

tables:
  input: event_session_feedback           # 10,141 rows / 43 sessions, rating int 1-5 (counted 2026-07-13)
  action: induction_session_effectiveness # loop memory; 1 row, measure_status='pending' as of 2026-07-13
  # supporting chain (all verified in information_schema):
  #   event_sessions (topic = event_id + fn_induction_norm_topic(title); NOT NULLs: event_id,title,start_at,end_at)
  #   events (seed NOT NULLs w/o default: institution_id, event_type, name, slug — all text/uuid)
  #   induction_programs (only event_id required; institution_id nullable but MUST be set for candidates/record)
  #   induction_enrollment (walk only: event_id, learner_id, institution_id required)
  #   event_session_speakers (speaker lane gate: profile_id = auth.uid())
  #   induction_completion (side effect: submit fn upserts value_score_avg per learner)

sim:
  sentinel: ZZISE                         # topic keys are lowercased by fn_induction_norm_topic -> 'zzise-…'
  # event_session_feedback FKs are REAL (unlike scf's session_feedback):
  #   learner_id -> learners_profiles(id), session_id -> event_sessions(id),
  #   event_id -> events(id), institution_id -> institutions(id).
  #   UNIQUE (session_id, learner_id). CHECK rating 1..5.
  #   CHECK (submitted_by IS NULL) = (capture_method='phone').
  # Seed a fully-sentinel event so the per-event RTM baseline is 100% controlled.
  seed_input: |
    -- (1) sentinel event: copy a VALID event_type from a real induction event
    INSERT INTO public.events (institution_id, event_type, name, slug)
    SELECT e.institution_id, e.event_type, 'ZZISE Audit Event', 'zzise-audit-event'
    FROM public.events e JOIN public.induction_programs ip ON ip.event_id = e.id
    LIMIT 1;
    -- (2) mark it an induction event (candidates fn resolves institution via induction_programs)
    INSERT INTO public.induction_programs (event_id, institution_id)
    SELECT id, institution_id FROM public.events WHERE slug = 'zzise-audit-event';
    -- (3) 6 topics x 2 runs. Controls U1..U5: run1 avgs 4.00/4.00/4.33/4.67/5.00
    --     (x-variance required!), run2 == run1  =>  regr slope=1, intercept=0.
    --     Treated T1: run1 avg 2.00 (< threshold 3.5), run2 avg 2.00 (no_change).
    INSERT INTO public.event_sessions (event_id, title, start_at, end_at)
    SELECT ev.id, t.title, t.s_at, t.s_at + interval '1 hour'
    FROM (SELECT id FROM public.events WHERE slug='zzise-audit-event') ev,
         (VALUES
           ('ZZISE-U1', now()-interval '10 days'), ('ZZISE-U1', now()-interval '2 days'),
           ('ZZISE-U2', now()-interval '10 days'), ('ZZISE-U2', now()-interval '2 days'),
           ('ZZISE-U3', now()-interval '10 days'), ('ZZISE-U3', now()-interval '2 days'),
           ('ZZISE-U4', now()-interval '10 days'), ('ZZISE-U4', now()-interval '2 days'),
           ('ZZISE-U5', now()-interval '10 days'), ('ZZISE-U5', now()-interval '2 days'),
           ('ZZISE-T1', now()-interval '10 days'), ('ZZISE-T1', now()-interval '2 days')
         ) AS t(title, s_at);
    -- (4) 3 ratings per session from 3 REAL learners (FK-safe; rolled back = no residue).
    --     Rating triples per topic (same triple both runs => identity RTM line):
    --     U1 (4,4,4)  U2 (4,4,4)  U3 (4,4,5)  U4 (4,5,5)  U5 (5,5,5)  T1 (2,2,2)
    INSERT INTO public.event_session_feedback
      (session_id, learner_id, event_id, institution_id, rating, capture_method, submitted_by)
    SELECT s.id, l.lid, s.event_id, ev.institution_id, r.rating, 'phone', NULL
    FROM public.events ev
    JOIN public.event_sessions s ON s.event_id = ev.id
    CROSS JOIN LATERAL (
      SELECT lp.id AS lid, row_number() OVER () AS ord
      FROM public.learners_profiles lp LIMIT 3
    ) l
    JOIN LATERAL (
      SELECT CASE s.title
        WHEN 'ZZISE-U1' THEN (ARRAY[4,4,4])[l.ord]
        WHEN 'ZZISE-U2' THEN (ARRAY[4,4,4])[l.ord]
        WHEN 'ZZISE-U3' THEN (ARRAY[4,4,5])[l.ord]
        WHEN 'ZZISE-U4' THEN (ARRAY[4,5,5])[l.ord]
        WHEN 'ZZISE-U5' THEN (ARRAY[5,5,5])[l.ord]
        WHEN 'ZZISE-T1' THEN (ARRAY[2,2,2])[l.ord]
      END AS rating
    ) r ON true
    WHERE ev.slug = 'zzise-audit-event';
  seed_action: |
    -- backdated tip on the treated topic's FIRST run (or call
    -- fn_induction_record_session_tip — Mgmt API runs as postgres, grant is service_role).
    -- topic_key MUST equal fn_induction_norm_topic(title) = 'zzise-t1'.
    INSERT INTO public.induction_session_effectiveness
      (institution_id, event_id, topic_key, first_session_id, window_start,
       input_avg, input_responses, suggestion, model, generated_at)
    SELECT ev.institution_id, ev.id, 'zzise-t1', s.id, s.start_at, 2.00, 3,
           '{"summary":"ZZISE CYCLE1 MARKER"}'::jsonb, 'moat-audit', now() - interval '3 days'
    FROM public.events ev
    JOIN public.event_sessions s ON s.event_id = ev.id AND s.title = 'ZZISE-T1'
    WHERE ev.slug = 'zzise-audit-event'
    ORDER BY s.start_at ASC LIMIT 1;
  # Pass the SENTINEL event id — p_event_id NULL would also scan the real
  # pending row(s) (1 as of 2026-07-13; harmless in ROLLBACK, but the
  # measured-count assert stops being exact).
  verifier: "public.fn_induction_measure_session_effectiveness('<zzise event id>'::uuid, 3.5, 3, 5)"
  asserts:
    no_change: "0.00"                     # net_effect: run2_avg 2.0 − (0 + 1·2.00); also expect rtm_expected_avg='2.00', measure_status='measured', returns 1
    known_delta: { seed: "UPDATE ZZISE-T1 LATER-run feedback SET rating=4", expect: "2.00" }
  reset_between_deltas: |
    UPDATE public.induction_session_effectiveness
    SET measure_status='pending', rerun_session_id=NULL, rerun_avg=NULL,
        rerun_responses=NULL, raw_lift=NULL, rtm_expected_avg=NULL,
        net_effect=NULL, outcome_measured_at=NULL
    WHERE topic_key = 'zzise-t1';
  notes:
    - NO maturity age gate — the verifier measures as soon as run2 has >= p_min_responses
      ratings (hours-fast by design; contrast the cohort loop's 300d gate).
    - topic identity = (event_id, fn_induction_norm_topic(title)) — batch runs MUST carry
      the byte-identical normalized title, and run order is start_at ASC (rn=1 vs rn=2).
    - RTM baseline is PER EVENT from UNTREATED pairs (run1_avg >= p_threshold AND run2
      exists). Fewer than p_min_pairs(5) usable pairs OR zero x-variance in run1 avgs
      => regr_slope NULL => measure_status='insufficient_rtm_data', net_effect NULL.
      Seed EXACTLY 5 controls with VARYING run1 avgs or the assert reads NULL.
    - controls with run2 == run1 give slope=1/intercept=0, so rtm_expected = input_avg
      and net_effect = run2_avg − input_avg; asserts derive from round(numeric,2)
      => '0.00'/'2.00' (this loop's own scale — never borrow another loop's numbers).
    - learner_id has a REAL FK to learners_profiles — select 3 existing learner ids;
      gen_random_uuid() is NOT safe here (unlike scf's session_feedback).
    - UNIQUE (session_id, learner_id) — use 3 DISTINCT learners per session.
    - the verifier CREATEs a TEMP table per event — run the whole sim as ONE
      BEGIN…ROLLBACK Mgmt-API batch or a self-rolling-back DO block
      (feedback_savepoint_subtransaction_self_rollback_sims).
    - fn_induction_record_session_tip ON CONFLICT does NOT reset outcome_* (unlike the
      cohort loop's record fn) — and the verifier skips measure_status='measured', so a
      measured topic is never re-measured; reset_between_deltas must set status back
      to 'pending', not just null the numbers.
    - candidates arm (optional extra assert, needs induction_programs seeded):
      fn_induction_session_loop_candidates('<zzise event id>', 3.5, 3) returns exactly
      1 row (zzise-t1) BEFORE seed_action, 0 rows after (NOT EXISTS guard).

# confound: OMITTED — cannot block. induction_session_effectiveness has NO
# human_verdict (or any verdict) column (information_schema verified 2026-07-13),
# so the not_tried-vs-tried falsification has nothing to read. Causal validity
# here is DESIGNED-IN instead: the RTM baseline from untreated re-run pairs is the
# built-in control (raw_lift vs net_effect columns keep the confounded and honest
# numbers side by side). Gap worth logging: no human-verdict arm means "speaker
# actually applied the tip" is unobserved — treated-vs-untreated is assignment by
# weakness, not by application.

feed_forward:
  # HONEST: there is NO scf-style AI feed-forward arm. The generator prompt is
  # built ONLY from the candidate row (verified: cron route generateTip()), and
  # candidates NOT-EXISTS-guard means one tip per (event, topic) ever — the AI
  # never re-reads its own measured outcome. The loop's adjust arm is HUMAN:
  reader: none (human arm — SessionLoopTipCard on /learners/my-induction, sessions-led-card.tsx)
  trigger:
    kind: cron_get
    path: /api/cron/induction-session-effectiveness?secret=$CRON_SECRET
    cadence: "43 */4 * * *"               # vercel.json, verified 2026-07-13
    note: Max-lane twin may defer the cloud run (shouldDeferToMaxLane('induction-session-effectiveness')); deferral returns ok:true deferred_to_max_lane:true.
  pass_criteria:
    - tip renders to the CREDITED speaker (event_session_speakers.profile_id) before the re-run
    - after re-run + verifier, EffectBadge shows honest net-of-luck effect ("+X above luck" only when net_effect > 0.05)
  notes:
    - registry edge induction-session -> induction-playbook ('measured_outcomes') is
      DECLARED but NOT wired in code — induction-generate-playbook route reads NO
      induction_session_effectiveness data (grep verified 2026-07-13). Treat as a gap,
      not a tested arm.
    - registry gates say f='on'; that claim maps to the human tip->re-run arm above,
      not to an AI-cites-prior mechanism.

walk:
  personas:
    student: test.student@jkkn.ac.in       # learner-linked profile (complete, per test-login roster)
    faculty: test.faculty@jkkn.ac.in       # CAUTION (adversarial verify 2026-07-13): this account's role is
                                           # staff_counselor (profiles.role + user_roles), NOT faculty, and
                                           # staff_counselor LACKS induction.view. The faculty custom_role does
                                           # have induction.view+manage=true, but this test account doesn't hold
                                           # it. Unused in hops — use superadmin for any coordinator-lane hop.
    superadmin: test.superadmin@jkkn.ac.in
  hops:
    - { as: superadmin, do: sql_seed,
        detail: "sentinel induction event + sessions (as in sim) COMMITTED, plus induction_enrollment (event_id, learner_id, institution_id — source defaults 'auto_first_year') for the student persona's learner_id, and event_session_speakers row crediting the student persona on the ZZISE-T1 first run",
        assert_db: "enrollment + speaker rows exist" }
    - { as: student, do: form_submit, page: /learners/my-induction,
        detail: "rate the sentinel session Low (fn_induction_submit_feedback; identity-bound via get_my_learner_id(); batch guard: session.batch_id NULL or = enrollment batch)",
        assert_db: "event_session_feedback row capture_method='phone' + induction_completion.value_score_avg upserted for the SENTINEL learner only" }
    - { as: superadmin, do: api_get, path: "/api/cron/induction-session-effectiveness?secret=$CRON_SECRET",
        assert: "http 200 ok:true; generated>=1 if AI key present (skipped generation still runs verifier); measured populated",
        note: "cron scans ALL induction events (EVENT_CAP 50) — a walk run may also tip REAL weak topics and spend AI budget; accept or time the walk when no real weak topic is pending" }
    - { as: student, do: open_assert, page: /learners/my-induction,
        expect: "Sessions-Led card shows SessionLoopTipCard for ZZISE-T1 with badge 'awaiting next-batch re-run' (pending) or '+X above luck' (measured)" }
    - { as: superadmin, do: open_assert, page: "/events/induction/[zzise-event-id]",
        expect: "event page renders sessions + ratings; NOTE: no coordinator-facing card consumes fn_induction_session_loop_summary today — only the speaker lane renders tips (grep verified 2026-07-13); assert the RPC directly if a coordinator view is required" }
  forbidden:
    - real-learner induction_completion.value_score_avg mutation (submit fn upserts it — sentinel learner only)
    - AI spend / tip rows for REAL weak topics via the cron hop (see hop-3 note)
    - nudges/digests/notifications — none exist on this path (route is DB-writes-only, verified), so ANY message observed = walk failure
  cleanup: |
    DELETE FROM public.event_session_feedback        WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event');
    DELETE FROM public.induction_session_effectiveness WHERE topic_key LIKE 'zzise%';
    DELETE FROM public.induction_completion          WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event');
    DELETE FROM public.event_session_speakers        WHERE session_id IN (SELECT id FROM public.event_sessions WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event'));
    DELETE FROM public.induction_enrollment          WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event');
    DELETE FROM public.event_sessions                WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event');
    DELETE FROM public.induction_programs            WHERE event_id = (SELECT id FROM public.events WHERE slug='zzise-audit-event');
    DELETE FROM public.events                        WHERE slug = 'zzise-audit-event';
    -- verify in a SEPARATE call: zzise counts = 0 everywhere; real
    -- induction_session_effectiveness count restored (baseline 1 on 2026-07-13).
  notes:
    - /learners/my-induction is in INDUCTION_ONLY_NAV_HREFS (sidebarMenuLink.ts) —
      student-reachable without a MENU_PERMISSIONS entry; /events/induction gates on
      induction.view ('/events/induction' -> 'induction.view' in MENU_PERMISSIONS).
    - fn_induction_session_loop_summary is authenticated: coordinator path needs
      induction.view + role_has_institution_access(event institution); speaker path
      needs event_session_speakers.profile_id = auth.uid() on first_ or rerun_session.
    - fuel reality 2026-07-13: exactly 1 real loop row (topic 'umis overview and
      interactive games', input_avg 3.33, event 'Fresher Induction 2026'), still
      'pending' — its topic never re-ran. Expect unmeasurable-no-fuel outside
      induction season; that is honest, not broken.

registry_gates_hint: '{"g":"on","a":"on","m":"on","f":"on"}'   # loop_registry verified 2026-07-13
