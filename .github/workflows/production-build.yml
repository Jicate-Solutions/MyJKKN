name: Production Build

# Runs the REAL production build on every pull request against main — `npm run
# build:ci`, which performs the same steps as the `npm run build` Vercel runs,
# at a lower V8 heap cap. `build` itself is never modified by this workflow, so
# what Vercel runs is byte-identical to what it ran before this file existed.
#
# ⚠️ This gate is RED on every PR today and the cause is NOT your PR. See
# "MEASURED" below before debugging. The lower cap was an attempt at the fix;
# it has not worked yet, and that section says what was measured instead.
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────────
#
# Until this workflow, NOTHING in this repository ever ran `next build` before a
# merge. Verified on main at the time of writing:
#
#   $ grep -rn "npm run build\|next build" .github/workflows/
#   nav-reachability-gate.yml:12:#   in only ONE place — `npm run build` at Vercel DEPLOY time — so orphans
#
# One hit, and it is a COMMENT saying exactly that: the build only ever ran after
# the merge, at Vercel deploy time. So a PR could be unanimously green and still
# be unbuildable, and the first thing to find out was the production deploy —
# which then blocks EVERY deploy repo-wide, not just the offending module.
#
# That is not hypothetical. PR #3239 (merged 2026-09-01) shipped a synchronous
# export from a file whose first line is `'use server'`, which Next.js forbids.
# Its head commit 03106910f4e577394bca7aa99101397f8991ab02 carried:
#
#   $ gh api repos/.../commits/03106910f4/check-runs --jq '[.check_runs[].conclusion] | group_by(.) | ...'
#   {"neutral":1,"skipped":2,"success":22}
#
# Twenty-two successes, zero failures, and not one of them compiled the app.
# Twice that month a hand-run local build was the only thing that caught this class.
#
# ── WHY A NEW FILE INSTEAD OF REVIVING `build-check.yml` ────────────────────────
#
# `.github/workflows/build-check.yml` is often assumed to cover this. It does not,
# for two independent reasons, both checked rather than remembered:
#
#  1. IT NO LONGER EXISTS. It was DELETED (not disabled) on 2026-06-11 by
#     c86a2243f5 "ci: retire AI Pulse gate + build-check, resurrect 4 orphaned
#     checks, add Claude risk review (#1330)" — a 60-line deletion. It has not run
#     on any PR since that date.
#
#  2. IT NEVER BUILT ANYTHING ANYWAY. Its last version ran `npx tsc --noEmit`
#     plus four script checks. The word "Build" in its name was the whole problem:
#     it made the hole look covered to anyone scanning the workflow list.
#
# And every one of its non-build steps is already live in a standalone workflow
# today, so restoring the file would duplicate five checks and change nothing:
#
#   check:reachability            → nav-reachability-gate.yml
#   check:sidebar                 → nav-reachability-gate.yml, module-config-audits.yml
#   check:audit-coverage          → nav-reachability-gate.yml, module-config-audits.yml
#   check-bug-module-classifier   → module-config-audits.yml
#   tsc --noEmit                  → typecheck-pr-scoped.yml
#
# So: a new workflow, scoped to the one thing genuinely missing, named after what
# it actually does.
#
# ── WHY THIS IS NOT REDUNDANT WITH `TypeCheck (PR-scoped)` ──────────────────────
#
# `next.config.ts` line 107 sets `typescript.ignoreBuildErrors: true`. The two
# gates therefore cannot cover for each other, in either direction:
#
#   • The build IGNORES type errors  → TypeCheck is the only thing catching those.
#   • TypeCheck never compiles the app → it cannot see a `'use server'` violation,
#     a bad import boundary, a failing `generateStaticParams`, or a module that
#     throws at import time during page-data collection.
#
# ── ADVISORY ON DAY ONE (deliberate) ────────────────────────────────────────────
#
# Adding a workflow file does NOT make it a required status check — branch
# protection carries an explicit list, and this job is not on it. So a red X here
# is INFORMATIONAL and blocks no merge.
#
# That is on purpose for the first weeks. Nobody has ever measured whether main
# builds clean in CI, because CI has never built it. If main is already broken,
# a required gate would red-wall every open PR at once for a break none of them
# caused — which is exactly what happened repo-wide in August. Let it run
# advisory, watch a week of real runs, THEN the Director can promote it by adding
# "Production Build" to the required checks on main.
#
# This job is written to survive that promotion unchanged: it ALWAYS runs and
# ALWAYS reports a conclusion, even for a docs-only PR (the expensive steps skip,
# the job still reports success). A `paths-ignore:` trigger filter would have been
# simpler but would make the check never report at all on a skipped PR, and a
# required check that never reports blocks the PR forever.
#
# ── MEASURED: THE BUILD DOES NOT FIT ON A STANDARD GITHUB RUNNER, AND ──────────
#                        LOWERING THE HEAP CAP DID NOT FIX IT
#
# ⚠️ READ THIS BEFORE DEBUGGING A RED MARK FROM THIS GATE. As of this writing it
# still fails on EVERY PR, including its own, and NOT because of the PR. Two
# hypotheses have been tested and written up below; neither has fixed it yet.
# Until it goes green once, treat a red mark here as "the build still does not
# fit" unless the log shows a NAMED error — the last section is how to tell.
#
# Every claim below is quoted from job logs, which are the only evidence that
# survives: see "the Report step never runs" at the end.
#
#   job 103691131931  9088d80c4d attempt 1
#   job 103691886647  9088d80c4d attempt 2   (byte-identical re-run)
#   job 103692773340  884a9e2def             (first run carrying the memory trace)
#   job 103693517213  dd9214c418
#
# All four compiled the app and then died to a bare pair of runner messages —
# `The runner has received a shutdown signal.` followed by
# `##[error]The operation was canceled.` — with no error of their own:
#
#   ✓ Compiled successfully in 4.3–4.8min   ← the app compiles. Nothing is broken.
#   ✓ Completed runAfterProductionCompile
#     Collecting page data using 3 workers ...
#   ##[error]The operation was canceled.    ← 22s, 27s and 76s later
#
# They did NOT all die in the same place, and the difference matters. Attempt 1
# never reached page-data collection at all: it has no "Collecting page data"
# line and no "✓ Completed runAfterProductionCompile", and died 5s after
# "Compiled successfully" while Sentry's runAfterProductionCompile hook was
# still running. The other three died 22–76s into page-data collection.
#
# ── WHAT THE MEMORY TRACE ACTUALLY SHOWS (it is NOT the page-data workers) ──
#
# Runner is 4 vCPU / 15 GiB + 3 GiB swap — printed by the "Runner capacity" step
# in all four runs (`vCPU: 4`, `Mem: 15Gi`). The trace from job 103692773340,
# against that run's own phase timestamps:
#
#   07:36:49  used=14818MB  avail=1170MB   ┐
#   07:37:19  used=15042MB  avail= 947MB   │ still "Creating an optimized
#   07:37:34  used=15547MB  avail= 442MB   │  production build ..."
#   07:37:49  used=15648MB  avail= 341MB   ┘
#   ... avail stays between 226MB and 582MB for the next two minutes ...
#   07:39:41  ✓ Compiled successfully in 4.8min
#   07:39:47  Collecting page data using 3 workers ...   ← workers start HERE
#   07:39:49  used=15860MB  avail= 129MB
#   07:40:14  ##[error]The operation was canceled.
#
# So the box was already exhausted — under 1 GB available from 07:37:19, and
# pinned near zero from 07:37:49 — a full 2.5 minutes BEFORE the first
# page-data worker existed. Job 103693517213 has the same shape (avail=326MB at
# 07:45:26; workers at 07:46:20).
#
# An earlier revision of this header blamed the three page-data workers, each
# inheriting the 12 GB heap ceiling. The trace above refutes that: the memory is
# consumed by the Turbopack COMPILE. Page-data collection is merely the phase
# that happens to be running when a host sitting at ~130 MB available is finally
# torn down — the last straw, not the cause.
#
# ── THE HEAP CAP: TRIED, AND SO FAR NOT THE ANSWER EITHER ───────────────────
#
# That same revision recommended a larger runner. Before spending money on that,
# the cheaper hypothesis was tested, because this repo had already written it
# down. Commit 53e85d8390 (2026-04-30), "fix(build): lower NODE_OPTIONS heap cap
# from 12 GB to 7 GB to fit Vercel's 8 GB container":
#
#   "V8 doesn't trigger GC aggressively until heap nears the 12 GB cap, so
#    total memory crosses the 8 GB physical limit and the Linux OOM-killer
#    fires SIGKILL before V8 itself starts cleaning up. Counter-intuitive fix:
#    lower the cap, not raise it. A smaller cap means V8 GCs sooner, keeping
#    total memory under physical RAM."
#
# Good hypothesis, and it fits the shape of the trace. MEASURED, it did almost
# nothing. Job 103713148466 ran the identical build at cap 8192 instead of
# 12288, and the two curves are the same within noise:
#
#              +2:00 avail   +2:45 avail   at death
#   cap 12288    1170 MB       442 MB       129 MB
#   cap  8192    1007 MB       593 MB       104 MB
#
# If the V8 old-space heap were what fills this box, halving its ceiling would
# have bent that curve. It did not, and there is a good reason: 53e85d8390 was
# measured against `next build --webpack`, a JavaScript bundler whose memory
# IS the V8 heap. Commit 042012f086 (#846) later switched this repo to
# `next build --turbopack`. Turbopack is Rust; its allocations live outside the
# V8 heap, where --max-old-space-size has no authority. That is also why
# next.config.ts carries a SEPARATE `turbopackMemoryLimit` knob — currently
# 4 GB, and evidently not holding either.
#
# So the cap is not (yet) the answer. What this workflow does have is its own
# entry point, which is what makes any of this testable without touching what
# Vercel runs:
#
#   `build`    — what Vercel runs. Cap 12288. UNTOUCHED by this workflow, and a
#                parity guard keeps it that way.
#   `build:ci` — what this job runs. The same steps in the same order, at
#                whatever cap is under test (currently 6144).
#
# cross-env sets NODE_OPTIONS explicitly and so overrides anything a workflow
# exports; a second script is the only way to build at a different cap. The
# duplication is guarded by scripts/ci/check-build-ci-parity.mjs, which fails if
# a step is ever added to one and not the other, or if the CI cap stops being
# the lower of the two.
#
# NEXT DIAGNOSTIC, already wired in: the memory trace now names the three
# largest processes by RSS at every sample. System-wide totals cannot tell
# "one compiler holding 12 GB" from "three workers holding 4 GB each", and
# those have different fixes. The next red run answers that question in its
# own log.
#
# ── WHAT THE CI BUILD IS AND IS NOT ─────────────────────────────────────────
#
# It is NOT byte-identical to Vercel's build. It runs the same steps, the same
# Turbopack, the same codegen and the same four `check:*` gates, with a smaller
# V8 heap ceiling.
#
#   CAUGHT: compile failures, a `'use server'` file with a synchronous export,
#   bad import boundaries, a module that throws at import time during page-data
#   collection, a failing generateStaticParams, and the gen:routes /
#   check:reachability / check:sidebar / check:audit-coverage gates. That set
#   includes the exact class that started this workflow (PR #3239).
#
#   NOT CAUGHT: a regression that builds at 12288 but not at the CI cap — extra
#   headroom in production that CI no longer has. That direction is the safe
#   one (CI is the stricter environment, so it fails first), but the reverse is
#   a genuine blind spot: something that genuinely needs more than the CI cap
#   goes red here while Vercel would have shipped it. If that happens, raise
#   `build:ci`'s cap toward 12288 — do not lower `build`'s.
#
#   ALSO NOT CAUGHT: type errors. next.config.ts sets ignoreBuildErrors, so
#   TypeCheck (PR-scoped) remains the only gate for those, in either build.
#
# ── TELLING THE TWO FAILURE KINDS APART ─────────────────────────────────────
#
# Do NOT use "did it get past Compiled successfully?" as the test. The class
# this gate exists to catch — a `'use server'` violation, an import-time throw,
# a failing generateStaticParams — surfaces DURING page-data collection, the
# same phase where the memory death lands. Use the ERROR SHAPE instead:
#
#   • Out of memory  → NO error from next/node at all, just the runner's own
#     `The runner has received a shutdown signal.` + `The operation was
#     canceled.`, and the memory trace's last samples read avail < 300MB.
#   • Caused by the PR → a NAMED error with a file and a reason, and the trace
#     still showing healthy headroom.
#
# One consequence worth knowing: when the runner is killed this way the job's
# final "Report" step does NOT run — `always()` cannot save a step on a machine
# being torn down. Confirmed: zero of the four logs contain any Report output.
# That is why this explanation lives here, in the file, rather than only in a
# step summary nobody will receive.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Inert until the merge queue is enabled on this repo, then it catches the
  # "two green PRs break when combined" class against the queue's merged tree.
  # Mirrors typecheck-pr-scoped.yml.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # A full build is 3-7 minutes. On a branch being pushed to repeatedly, the older
  # runs are answering a question nobody is asking any more. Superseded runs report
  # `cancelled`, which is neither pass nor fail — correct for a run that was
  # abandoned, and harmless here because the newer run replaces its verdict.
  group: production-build-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    # A real build here is 3-7 minutes. 30 is deliberately generous: a timeout
    # reports `cancelled`, which reads as neither pass nor fail, so a clock that
    # is merely tight turns this gate into a source of unreadable verdicts.
    timeout-minutes: 30

    # NOTE: deliberately NO `if: ${{ !github.event.pull_request.draft }}`.
    #
    # TypeCheck (PR-scoped) and the terminology gate both skip drafts, which is a
    # reasonable trade for them. It is the wrong trade here: a build break is
    # cheapest to fix while the author is still drafting, and "it looked green
    # while nothing checked it" is the precise failure this gate exists to end.
    # Cost is controlled by the build-relevance filter below instead — docs-only
    # and SQL-only PRs never pay for an install or a build.

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the base...head diff below

      # Cost control. This repo's PRs are frequently docs-only or migration-only,
      # and those cannot change the output of `next build`. Skipping them saves
      # ~5 minutes of Actions time per PR without creating a blind spot: the deny
      # list below is conservative, so anything not obviously inert builds.
      # The filter itself lives in scripts/ci/build-relevance.sh so that its
      # test suite runs the SAME code this step runs. It did not, originally,
      # and the inline version shipped a false green: it asked git for
      # `--diff-filter=AM`, so a PR that only DELETED or only RENAMED source
      # files scored zero, skipped the build, and reported success. Merged
      # PR #3295 (23 deleted route files) is a real example. See that script's
      # header for the measurement and scripts/ci/build-relevance.test.sh for
      # the fixtures — deletion, rename, rename-out-to-docs and typechange are
      # all pinned there, and all four fail against the old invocation.
      - name: Does this PR touch anything the build reads?
        id: relevant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          scripts/ci/build-relevance.sh changed  "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          scripts/ci/build-relevance.sh relevant "$BASE_SHA" "$HEAD_SHA" > /tmp/build-relevant.txt

          total=$(wc -l < /tmp/changed.txt | tr -d ' ')
          count=$(wc -l < /tmp/build-relevant.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

          echo "::group::Build-relevant files ($count of $total changed)"
          head -50 /tmp/build-relevant.txt
          # `if` rather than `[ … ] && echo`. Both are correct under `set -e` —
          # bash exempts a failing test on the left of `&&` from -e, which was
          # confirmed by running it, not by reading the manual — but the `if` form
          # does not require the reader to know that exemption to see it is safe.
          if [ "$count" -gt 50 ]; then echo "... and $((count - 50)) more"; fi
          echo "::endgroup::"

      - name: Skip — nothing build-relevant changed
        if: steps.relevant.outputs.count == '0'
        run: |
          echo "::notice::This PR changes only docs/SQL/spec files, which cannot affect \`next build\`. Build skipped."
          {
            echo "## Production Build — skipped"
            echo ""
            echo "This PR touches no file that \`next build\` reads (docs, specs, SQL and"
            echo "migrations only), so the build was not run. The check reports success so that"
            echo "it stays safe to promote to a required check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.relevant.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          # 22 matches typecheck-pr-scoped.yml and one of the two majors that
          # seed-node-modules-cache.yml warms. Changing it here costs a cold
          # install on every run.
          node-version: '22'

      # Key is byte-identical to the one seed-node-modules-cache.yml writes from
      # main, which is the only way a PR run gets a hit: GitHub scopes caches
      # created inside a PR to that PR's own merge ref.
      - name: Cache node_modules
        if: steps.relevant.outputs.count != '0'
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.relevant.outputs.count != '0' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # Printed because the answer was not knowable before this workflow's first
      # real run, and it decides whether this gate is viable as written.
      #
      # `npm run build` hard-codes `cross-env NODE_OPTIONS="--max-old-space-size=12288
      # --max-semi-space-size=128"` — a 12 GB heap ceiling. cross-env sets those
      # explicitly, so they OVERRIDE anything this workflow exports; the values
      # cannot be tuned from here without editing package.json, which would change
      # what Vercel runs and is out of this change's scope.
      #
      # NOW ANSWERED, by this step itself on all four runs to date: the runner is
      # 4 vCPU / 15 GiB + 3 GiB swap (`vCPU: 4`, `Mem: 15Gi`) — NOT the 2 vCPU /
      # ~7 GB an earlier revision of this comment predicted. The prediction was a
      # guess written before the first run; the numbers below are the measurement.
      # The extra headroom does not save the build: see the memory trace in the
      # header, where the compile alone drives available memory under 300 MB.
      #
      # Keep this step. A 12 GB ceiling is a ceiling, not an allocation, so an
      # over-budget build does not fail with a clean message — the kernel or the
      # runner agent ends it and the log reads as a generic cancellation. Having
      # the machine's real size in every log turns that diagnosis into seconds.
      - name: Runner capacity (diagnostic for the heap ceiling)
        if: steps.relevant.outputs.count != '0'
        run: |
          echo "vCPU: $(nproc)"
          free -h
          echo "This job runs 'npm run build:ci' (heap cap 6144). Vercel runs 'npm run build' (12288)."
          echo "If this job dies with a bare non-zero exit or 'Killed', compare that to MemTotal above."

      # `build:ci`, NOT `build`. Same steps in the same order — the parity guard
      # in the self-test job enforces that — differing only in the V8 heap cap:
      # 6144 here against production's 12288. See the header for why a LOWER cap
      # is what makes the build fit. `build` itself is untouched, so the command
      # Vercel runs is byte-identical to what it was before this workflow existed.
      - name: Build (same steps as Vercel, lower heap cap)
        if: steps.relevant.outputs.count != '0'
        env:
          # ── PLACEHOLDERS, NOT SECRETS ────────────────────────────────────────
          # Nothing here is real and nothing here may become real. This job
          # compiles the app; it must never hold a credential that could reach a
          # live database, because a build runs arbitrary repo code.
          #
          # They exist because `lib/supabase/server.ts:92` throws
          # "Missing Supabase service role credentials" when SUPABASE_SERVICE_ROLE_KEY
          # is absent, and any module that builds a client at import time would
          # take the build down during page-data collection. A syntactically valid
          # value is all that is needed — supabase-js validates that the URL parses,
          # and never contacts the host at build time.
          #
          # No repo secret is used or added. Checked before writing this: no
          # workflow in .github/workflows references a SUPABASE_SERVICE_ROLE_KEY
          # secret, so there was none to reuse. In particular SUPABASE_DB_URL is
          # NOT repurposed here — it is a SHARED SUPERUSER connection string used
          # by five workflows, and handing it to a build job would be a privilege
          # escalation dressed as a convenience.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-build-only
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-build-only
          # Keeps Next's anonymous build telemetry out of CI.
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          # A memory sampler streaming to STDOUT, not to a file summarised at the
          # end. That distinction is the whole point: when a job dies of memory
          # exhaustion the runner agent is killed too, so any "print the peak
          # afterwards" step never executes and the log ends on silence. Streamed
          # lines are already in the log when the process dies, so the trajectory
          # up to the last breath is readable.
          #
          # Added after this gate's first two runs both died at exactly
          # "Collecting page data using 3 workers ..." with a bare
          # "##[error]The operation was canceled." and no diagnostic of any kind.
          # ~20 lines per build, inside a collapsed group.
          # Each sample also names the three largest processes by RSS. Added
          # after the cap step-down from 12288 to 8192 moved the curve by almost
          # nothing (avail at +2:00 went 1170MB -> 1007MB; death 129MB -> 104MB),
          # which says the V8 old-space heap is not what is filling this box.
          # System-wide totals cannot distinguish "one compiler holding 12 GB"
          # from "three workers holding 4 GB each", and those two have different
          # fixes. Per-process RSS can.
          echo "::group::Memory trace (15s samples)"
          ( while true; do
              echo "[mem] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB", $3, $7}') top3(pid:rss) $(ps -eo pid,rss,comm --sort=-rss --no-headers 2>/dev/null | head -3 | awk '{printf "%s:%dM/%s ", $1, $2/1024, $3}')"
              sleep 15
            done ) &
          sampler=$!
          # Do not let the sampler's death mask the build's exit code.
          set +e
          npm run build:ci
          build_exit=$?
          set -e
          kill "$sampler" 2>/dev/null || true
          echo "::endgroup::"
          exit "$build_exit"

      - name: Report
        if: always() && steps.relevant.outputs.count != '0'
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## Production Build passed"
              echo ""
              echo "\`npm run build:ci\` completed — the same steps Vercel runs on deploy, at a"
              echo "lower V8 heap cap (8 GB here, 12 GB on Vercel)."
            else
              echo "## Production Build FAILED"
              echo ""
              echo "\`npm run build:ci\` did not complete. It runs **the same steps Vercel runs**,"
              echo "so merging this PR is likely to block deploys for the whole repository, not"
              echo "just for the module this PR touches."
              echo ""
              echo "Reproduce locally with the same placeholder env:"
              echo ""
              echo '```bash'
              echo 'NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \'
              echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key-build-only \'
              echo 'SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key-build-only \'
              echo 'npm run build:ci'
              echo '```'
              echo ""
              echo "One failure mode is specific to CI: \`build:ci\` caps V8 at 8 GB where Vercel"
              echo "allows 12 GB, so a change that genuinely needs more than 8 GB fails here and"
              echo "would have shipped there. The memory trace in the log tells you which — an"
              echo "out-of-memory death has no named error, just the runner's own shutdown"
              echo "message, with the last samples reading avail < 300MB. If that is what you"
              echo "see, raise \`build:ci\`'s cap; never lower \`build\`'s."
              echo ""
              echo "Note that \`npm run build:ci\` also re-runs \`check:sidebar\`, \`check:reachability\`"
              echo "and \`check:audit-coverage\`. If **nav-reachability-gate** or"
              echo "**module-config-audits** is also red on this PR, fix that first — this job is"
              echo "most likely reporting the same underlying failure, before it ever reached"
              echo "\`next build\`."
            fi
            echo ""
            echo "---"
            echo ""
            echo "_**Advisory check.** \`Production Build\` is not in the required checks on main,"
            echo "so a red mark here does not block this merge. It is reporting a real fact about"
            echo "the build regardless._"
          } >> "$GITHUB_STEP_SUMMARY"

  # Matches the self-test job the other gates in this repo carry
  # (secdef-anon-revoke.yml, ungrantable-permissions.yml, typecheck-pr-scoped.yml).
  #
  # It exists because the relevance filter's FIRST version was tested — with two
  # fixtures, "docs-only -> 0" and "mixed code -> 3". Both were Added/Modified
  # files, and the filter said `--diff-filter=AM`, so the tests exercised only
  # paths that already passed and the gate shipped blind to deletions and
  # renames. A fixture set that proves only the happy path is how a broken gate
  # stays green. Every "-> build" case in the suite is one the old filter got
  # wrong.
  #
  # Cheap: pure bash and git against a scratch repo, no npm install, no build.
  self-test:
    name: The build gate's own tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Test the relevance filter
        run: bash scripts/ci/build-relevance.test.sh

      # The build job runs `build:ci`, a deliberate duplicate of `build` with a
      # lower heap cap. Duplicates drift; this fails the moment they do, rather
      # than letting the gate keep reporting green while compiling something
      # that is no longer what Vercel compiles.
      - name: build:ci still matches build
        run: node scripts/ci/check-build-ci-parity.mjs
