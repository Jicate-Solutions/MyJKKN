loop_key: pde-quest
name: PDE Quest → Demonstration Loop
prod_ref: kvizhngldtiuufknvehv

tables:
  # The demonstration row is BOTH where the signal enters and where the
  # action/verdict lands (status machine on the same row) — unlike scf there
  # is no separate suggestions table.
  input: pde_demonstrations    # evidence enters here: learner form POST /api/pde/demonstrations OR the ai_pulse bridge
  action: pde_demonstrations   # reviewer verdict + scoring stamped on the same row: status / raw_score / weighted_score / passed / scored_at
  # Related tables + FILL-RATES (prod counts 2026-07-13 via Mgmt API):
  #   pde_quests=1, pde_quest_enrollments=0, pde_quest_submissions=0
  #     → the QUEST lane of this loop has NEVER carried prod traffic (dark).
  #   pde_demonstrations=35 — ALL 35 have evidence->>'source'='ai_pulse'
  #     (bridge rows: category embodied, evidence_type engagement_record,
  #     status scored, created 2026-07-10..11). ZERO learner-submitted demos.
  #   pde_agency_index=0 (snapshot lane empty — agency score is recomputed
  #     LIVE from scored pde_demonstrations in a 90-day window per
  #     lib/services/pde-agency-live-service.ts, mode policy
  #     pde.visibility.agency_index_mode).
  #   pde_engagement_events=0, pde_learner_capabilities=0 (legacy
  #     pde-bridge-service lane also dark).

# sim: OMITTED — honest gap, not an oversight.
# Class 'cadence' + registry gates.m='off', and pg_proc (checked 2026-07-13)
# has NO measure function for this loop: no fn_pde_measure_*; the only pde
# functions are fn_pde_validate_demonstration, fn_pde_review_queue,
# fn_pde_agency_distribution_for_facilitator, fn_pde_get_syllabus_outcomes,
# fn_pde_list_approved_syllabi, fn_pde_list_vac_courses, pde_auto_grade_submission,
# pde_log_engagement, pde_next_certificate_number, pde_set_updated_at.
# A known-delta sim would require a measurer that stamps an outcome delta on
# action rows (e.g. re-engagement / capability lift after a validated
# demonstration, vs a per-learner baseline). No such fn exists — do NOT invent one.

# confound: OMITTED — pde_demonstrations has verdict-ish columns
# (status 'validated'/'rejected', passed boolean) but NO after-action outcome
# column (no outcome_lift analog measured post-verdict), so the
# not_tried-vs-tried falsification has nothing to read. (Columns verified via
# information_schema.columns 2026-07-13.)

# feed_forward: OMITTED — registry gates.f='off'; no reader conditions the
# next quest/demonstration generation on a prior row's measured outcome.
# The closest live coupling is one-directional: scored demonstrations →
# live agency score (pde-agency-live-service) → displayed on Pulse/faculty
