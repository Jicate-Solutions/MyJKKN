name: TypeCheck (PR-scoped)

# Runs `tsc --noEmit` and FAILS only on errors in files this PR touched.
# Rationale: next.config.ts sets `typescript.ignoreBuildErrors: true` so the
# Vercel build masks all TS violations. The full-repo type-error count is
# non-zero today (legacy debt). A repo-wide gate would be too noisy to act on.
# A PR-scoped gate is the ratchet — new PRs cannot ADD type errors to files
# they modify. Existing baseline noise is ignored.
#
# Catches the PR #856 / #873 bug class: state type changes from string → object
# but legacy reset sites still pass empty string. The local `setCounterBreakdown('')`
# at line 579 was visible to tsc but masked by ignoreBuildErrors. This gate
# would have caught it pre-merge.
#
# 2026-08-16 — IT DID NOT, AND NEVER HAD. From the day it shipped until this
# commit the filter was structurally incapable of matching a single error, so the
# job reported success on every pull request ever opened. Receipt, re-measured
# against main today: PR #2891 (merged 2026-08-13, 8169b59d91) changed exactly one
# file, app/api/cron/aipulse-domain-starter-notify/route.ts, and left NINE type
# errors in it — six `TS2304: Cannot find name`, two TS18004, one TS2552 — while
# `TypeCheck (PR-scoped)` reported conclusion=success on head bed455df36. The PR
# head blob and main's blob are the same object (0aab25de8d), so this was not a
# bad merge. Read scripts/ci/filter-tsc-scoped-errors.sh for the two independent
# reasons, and treat every green run of this gate before 2026-08-16 as meaningless.
#
# AND THE COMPILER WAS NEVER FINISHING EITHER. The crash guard added in the same
# commit fired on its first run: tsc OOMs at the default ~2 GB heap after ~27 s,
# and does NOT complete at 8 GB either (~35 min, then "Ineffective mark-compacts
# near heap limit"). Two independent causes, either one on its own enough to make
# every run of this gate meaningless.
#
# BOTH ARE NOW FIXED. The filter no longer depends on tsc's output formatting, and
# the compiler is no longer asked to do the impossible: instead of the whole
# project, it compiles a program rooted at the files THIS PR touched (their
# transitive imports come along, so the checking is real — only the roots narrow).
# That is what this gate always meant, since it only ever fails on errors in
# PR-touched files; compiling the other ~14,000 files bought no part of the verdict.
#
# Whole project: 115 min at 16 GB off-runner, OOM at 8 GB on one. Scoped to the one
# file PR #2891 broke: 2 seconds at 4 GB, reporting exactly its nine errors. Three
# App Router pages that are clean in the whole-project baseline stay clean when
# scoped, so the narrowing does not manufacture false failures. Measurements and
# the one glob that undoes all of it are in the step env below.
#
# 2026-09-07 — A BYPASS EXISTS: the `typecheck-skip` label, applied by the Director
# or the PR's own author. This is a required status check and `enforce_admins` is
# true on main, so before this there was no override at all — PR #3332 sat blocked
# behind 37 type errors that lived in 21 commits unrelated to its 32 files. The
# bypass does NOT skip the compile: tsc runs, reports the same findings as
# warnings, and the job exits 0 with the labeler named in the run summary. See the
# "Resolve typecheck-skip bypass" step for the authority rules and why an
# unauthorized label is ignored rather than fatal.

on:
  pull_request:
    # `labeled`/`unlabeled` are here for the `typecheck-skip` bypass below. Without
    # them, applying the label re-runs nothing and the required check stays red on
    # its last verdict — the bypass would look broken.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  # Merge queue (2026-07-11): tsc re-runs on the queue's merged tree (latest
  # main + this PR), catching the "two green PRs break when combined" class —
  # e.g. a sibling PR renames a function this PR still calls. Inert until the
  # merge queue is enabled on the repo.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Both are READ-only and exist solely for the `typecheck-skip` authority check:
  # `pull-requests` for `gh pr view` (labels + author), `issues` for the timeline
  # API that names who applied the label. The gate never writes.
  pull-requests: read
  issues: read

jobs:
  typecheck:
    name: TypeCheck (PR-scoped)
    runs-on: ubuntu-latest
    # 15 was never enough and nobody could tell, because the job had been dying of
    # an OOM at ~27 s long before the clock was ever the binding constraint. With a
    # heap it can finish in, tsc was still compiling when the 15-minute limit
    # killed it as an orphan process (run 31921510185). A full `tsc --noEmit` over
    # this codebase is a long job; 45 is set so that a timeout cannot masquerade as
    # a verdict — a timeout reports `cancelled`, which is neither pass nor fail and
    # reads as neither.
    timeout-minutes: 45
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for base...head diff

      - name: Compute changed TS files (PR scope)
        id: changed
        env:
          # Exactly one context exists per event: pull_request → PR base/head;
          # merge_group → the queue group's parent/head (this PR's slice only —
          # groups chain, so base_sha already contains PRs ahead in the queue).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          # Files added/modified by this PR (excluding deletions — no point checking removed files)
          git diff --name-only --diff-filter=AM "$BASE_SHA"..."$HEAD_SHA" > /tmp/changed-files.txt
          # Filter to .ts/.tsx only
          grep -E '\.(ts|tsx)$' /tmp/changed-files.txt > /tmp/changed-ts.txt || true
          count=$(wc -l < /tmp/changed-ts.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::group::Changed TS files ($count)"
          head -50 /tmp/changed-ts.txt
          [ "$count" -gt 50 ] && echo "... and $((count - 50)) more"
          echo "::endgroup::"

      - name: Skip if no TS changes
        if: steps.changed.outputs.count == '0'
        run: echo "::notice::No .ts/.tsx files changed in this PR. Install + typecheck skipped (Actions minutes saved)."

      # ── The `typecheck-skip` bypass ──────────────────────────────────────────
      #
      # WHY A BYPASS EXISTS AT ALL. `TypeCheck (PR-scoped)` is one of four required
      # status checks on main and `enforce_admins` is true, so there is no admin
      # override — not via `gh pr merge --admin`, not via the API. When a branch
      # carries type errors from commits that are not the point of the PR (measured
      # on PR #3332: 37 errors across 21 unrelated commits, none of them in the 32
      # files the PR was actually about), the only paths were "fix ten other
      # people's files" or "rebuild the branch". This label is the third path.
      #
      # WHO. The Director or the PR's own author. The author can unblock their own
      # PR; the Director can unblock anyone's. Mirrors the authority pattern in
      # visual-proof-gate.yml, which resolves the applier from the issue timeline's
      # last `labeled` event — the label's presence alone says nothing about who put
      # it there, and `github.event.sender` is whoever triggered THIS run, which is
      # a different person on a later `synchronize`.
      #
      # AN UNAUTHORIZED LABEL IS IGNORED, NOT FATAL — deliberately unlike
      # visual-proof-gate, which fails closed. There, falling through still blocks
      # (no proof is no proof), so failing costs nothing. Here, falling through means
      # "run the real typecheck and judge the PR on its merits", which is the correct
      # and safe outcome. Failing instead would hand any account with label access a
      # way to redden a green PR it has no other power over.
      #
      # THE BYPASS DOES NOT SILENCE THE COMPILER. tsc still runs and still reports
      # every error it finds in PR-touched files; the verdict is downgraded from
      # ::error:: to ::warning:: and the job exits 0. A bypass that skipped the
      # compile would save ~3 minutes and leave no record of what it waved through —
      # and this gate has already spent its entire first life reporting success
      # while checking nothing. Never again by design.
      - name: Resolve typecheck-skip bypass
        id: bypass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -uo pipefail
          BYPASS_LABEL="typecheck-skip"
          DIRECTOR_LOGIN="Ommsharravana"

          # Merge-queue runs carry no PR object. Recover the number from the queue
          # branch (gh-readonly-queue/main/pr-N-…) exactly as visual-proof-gate does,
          # so a bypassed PR is not re-blocked the moment the queue is enabled.
          if [ "${GITHUB_EVENT_NAME:-}" = "merge_group" ]; then
            PR_NUMBER=$(sed -E 's#.*/pr-([0-9]+)-.*#\1#' <<< "$MG_HEAD_REF")
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::warning::Cannot parse a PR number from '$MG_HEAD_REF' — bypass unavailable in this run."
              echo "bypass=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login' 2>/dev/null || echo "")
          fi

          HAS_LABEL=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq "[.labels[].name] | index(\"$BYPASS_LABEL\") != null" 2>/dev/null || echo "false")

          if [ "$HAS_LABEL" != "true" ]; then
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Who applied it: the LAST `labeled` event for this label on the timeline.
          # Last, not first, so removing and re-adding re-attributes it correctly.
          LABELER=$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" --paginate \
              --jq "[.[] | select(.event == \"labeled\" and .label.name == \"$BYPASS_LABEL\")] | last | .actor.login" \
              2>/dev/null || echo ""
          )

          if [ "$LABELER" != "$DIRECTOR_LOGIN" ] && [ "$LABELER" != "$PR_AUTHOR" ]; then
            {
              echo ""
              echo "## ⚠️ \`$BYPASS_LABEL\` ignored — applied by an unauthorized user"
              echo ""
              echo "The label was applied by \`${LABELER:-unknown}\`. Only \`$DIRECTOR_LOGIN\` (Director)"
              echo "or this PR's author (\`${PR_AUTHOR:-unknown}\`) can bypass this gate."
              echo ""
              echo "The typecheck below ran normally and its verdict stands."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Unauthorized typecheck-skip::'$BYPASS_LABEL' applied by '${LABELER:-unknown}' — ignored; the gate ran normally."
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bypass=true" >> "$GITHUB_OUTPUT"
          echo "labeler=$LABELER" >> "$GITHUB_OUTPUT"
          echo "::notice title=TypeCheck bypass armed::'$BYPASS_LABEL' applied by '$LABELER' — errors will be reported as warnings and will not fail this check."

      # Setup/install moved BELOW the changed-files computation (2026-06-12)
      # so docs/sql/config-only PRs never pay the ~1min npm ci cost.
      - name: Setup Node
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # npm download cache intentionally NOT used: the node_modules cache
          # (seeded from main) makes it dead weight on hits; lockfile-change
          # misses pay a one-off cold install instead (rare, acceptable).

      # node_modules cache: keyed on the lockfile — a hit skips npm ci.
      - name: Cache node_modules
        if: steps.changed.outputs.count != '0'
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.changed.outputs.count != '0' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # The filtering lives in scripts/ci/filter-tsc-scoped-errors.sh rather than
      # inline here, because inline shell in a workflow cannot be run against a
      # fixture — and this gate's failure mode is "goes green". It shipped with a
      # grep that could never match (tsc --pretty writes ANSI colour codes even
      # into a file, so the `^path:` anchor never landed) and stayed that way
      # until PR #2891 merged nine type errors past a successful run of it.
      # See the script header, and __tests__/ci/filter-tsc-scoped-errors.test.ts.
      - name: Run tsc + filter to PR-touched files
        if: steps.changed.outputs.count != '0'
        env:
          # Consumed at the bottom of this step. The compile and the filter run
          # identically either way — only the verdict's severity changes.
          BYPASS: ${{ steps.bypass.outputs.bypass }}
          BYPASS_LABELER: ${{ steps.bypass.outputs.labeler }}
          # WHY THIS DOES NOT RUN `npm run typecheck` (whole-project tsc).
          #
          # It cannot finish inside a CI job. Measured on this PR:
          #
          #   default (~2 GB)          OOM at 27 s                 run 31921352286
          #   12288                    no OOM, hit 15 min limit    run 31921510185
          #   12288 + semi-space 128   no OOM, past 31 min, killed run 31922158016
          #   8192                     OOM at ~35 min, "Ineffective mark-compacts
          #                            near heap limit", mark-compact pauses of
          #                            193 s and 228 s, average mu = 0.044 — i.e.
          #                            ~96% of the run was garbage collection.
          #
          # It is not infinite, though, and that distinction decided the design:
          # the same compiler DOES complete off-runner at --max-old-space-size=16384,
          # in 115 minutes, reporting 1,402 baseline errors (measured 2026-08-14).
          # So whole-project tsc is not impossible — it is unaffordable per PR, and
          # no heap value fixes that. A bigger runner would only buy a slower pass.
          #
          # SCOPING THE PROGRAM is what makes it affordable, and it is also what the
          # gate actually wants: this job only ever fails on errors in PR-touched
          # files, so compiling the other ~14,000 files was never buying a verdict.
          # A tsconfig whose `include` is just the changed files still pulls their
          # transitive imports into the program — the type checking is real, only the
          # roots are narrowed.
          #
          # Measured on the same machine, same compiler, against the file PR #2891
          # broke (app/api/cron/aipulse-domain-starter-notify/route.ts):
          #
          #   whole project   115 min at 16 GB   1,402 errors (9 of them in that file)
          #   scoped to it      2 s   at  4 GB       9 errors, exactly those nine
          #                                          (6× TS2304, 2× TS18004, 1× TS2552)
          #
          # And checked for the failure that would matter more — false positives, a
          # gate that blocks correct PRs: three App Router pages that are CLEAN in
          # the 1,402-error whole-project baseline, including a dynamic [id] route,
          # report zero errors under the scoped config. Narrowing the roots did not
          # invent diagnostics.
          #
          # ⚠️ DO NOT add ".next/types/**/*.ts" (or .next/dev/types) to the generated
          # include. tsconfig.json lists them, but `.next` does not exist in CI (this
          # job never builds), and where it DOES exist — any developer's checkout — it
          # is ~1 GB of generated .ts and it OOMs the scoped run in 34 s at the default
          # heap. That is the whole-project failure reintroduced through a glob.
          #
          # 8192 is kept purely as headroom for a very large PR; the scoped run fits
          # in 4 GB with room to spare.
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set +e

          # Build the scoped program from the changed-files list. `exclude` here
          # deliberately DROPS tsconfig.json's "scripts" and "__tests__" entries:
          # the base config excludes both, which made this gate structurally blind
          # to every change under them — including its own test file.
          node -e '
            const fs = require("fs");
            const files = fs.readFileSync("/tmp/changed-ts.txt", "utf8")
              .split("\n").map((s) => s.trim()).filter(Boolean);
            fs.writeFileSync("tsconfig.pr-scoped.json", JSON.stringify({
              extends: "./tsconfig.json",
              include: files,
              exclude: ["node_modules", "public/sw.js", "whatsapp-service"],
            }, null, 2));
          '
          echo "::group::Scoped tsconfig"
          cat tsconfig.pr-scoped.json
          echo "::endgroup::"

          npx tsc --noEmit --pretty -p tsconfig.pr-scoped.json > /tmp/tsc-output.txt 2>&1
          tsc_exit=$?

          # The filter is the whole verdict and it is fixture-tested
          # (__tests__/ci/filter-tsc-scoped-errors.test.ts). It is called here
          # byte-identically in both modes and its output is captured rather than
          # streamed, so the bypass can restate it without the script needing an
          # "advisory" code path of its own — a second path through the one piece of
          # this gate whose failure mode is "goes green" is exactly what should not
          # exist. The severity swap happens out here, in plain sight.
          scripts/ci/filter-tsc-scoped-errors.sh \
            --tsc-output /tmp/tsc-output.txt \
            --changed /tmp/changed-ts.txt \
            --tsc-exit "$tsc_exit" > /tmp/verdict.txt 2>&1
          verdict=$?
          set -e

          if [ "${BYPASS:-false}" != "true" ]; then
            cat /tmp/verdict.txt
            exit "$verdict"
          fi

          # ── Bypassed ────────────────────────────────────────────────────────────
          # Same compile, same filter, same findings — restated as warnings. Every
          # annotation the script emits starts at column 0 with `::error`, in both
          # its forms (`::error::summary` and `::error file=…,line=…::message`), so
          # one anchored substitution covers them and nothing in a message body can
          # be rewritten by accident.
          sed -E 's/^::error/::warning/' /tmp/verdict.txt

          if [ "$verdict" -eq 0 ]; then
            {
              echo ""
              echo "## ✅ TypeCheck passed — \`typecheck-skip\` was not needed"
              echo ""
              echo "The label is on this PR (applied by \`${BYPASS_LABELER:-unknown}\`) but the gate"
              echo "found nothing to bypass. Remove it to keep the check meaningful on later pushes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo ""
            echo "## ⚠️ TypeCheck bypassed via \`typecheck-skip\`"
            echo ""
            echo "Applied by: \`${BYPASS_LABELER:-unknown}\`"
            echo ""
            echo "tsc **did** find type errors in files this PR touches. They are listed above as"
            echo "warnings and this required check is reporting success anyway, so the merge is not"
            echo "blocked. Nothing about them is fixed."
            echo ""
            echo "\`next.config.ts\` sets \`typescript.ignoreBuildErrors: true\`, so the Vercel build"
            echo "will not catch these either — this gate was the only thing looking."
            echo ""
            echo "<details><summary>The errors that were waved through</summary>"
            echo ""
            echo '```'
            # The filter writes the matched diagnostics to <tsc-output>.scoped in
            # their original `path:LINE:COL - error TSnnnn: message` form. Preferred
            # over re-parsing the ::annotations::, which drop the path into the
            # `file=` attribute and would leave the summary listing bare messages.
            if [ -s /tmp/tsc-output.txt.scoped ]; then
              head -60 /tmp/tsc-output.txt.scoped
            else
              head -60 /tmp/verdict.txt
            fi
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=TypeCheck bypassed::Type errors in PR-touched files were waved through by '$BYPASS_LABELER' via the typecheck-skip label."
          exit 0

  # A separate job rather than a step inside `typecheck` (which is how
  # ai-estate-guard and anon-exposure-live do it) because that job is skipped
  # entirely when a PR changes no .ts/.tsx files — and a PR that edits ONLY the
  # filter script is exactly that shape. The tests have to run then most of all.
  #
  # The job name is the status-check identity and must be unique across the repo:
  # `ungrantable-permissions.yml` already owns the bare "The gate's own tests",
  # and two check runs sharing a name cannot be told apart by branch protection.
  self-test:
    name: The typecheck gate's own tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # A gate that is not itself tested is a gate that quietly stops gating, and
      # this one already did it once for its whole life. Every fixture here is a
      # shape that made the old filter report zero: ANSI-coloured paths, the
      # indented "Errors  Files" summary, a tsc that crashed instead of running.
      - name: Test the gate
        run: npx vitest run __tests__/ci/filter-tsc-scoped-errors.test.ts
