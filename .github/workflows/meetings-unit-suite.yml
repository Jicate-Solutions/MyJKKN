name: Meetings unit suite

# Runs the unit tests under __tests__/meetings/**. Until this workflow existed,
# not one of them had ever executed on a pull request.
#
# WHY THIS EXISTS
#   Measured on jicate/main at 49ae115004, 2026-08-19: __tests__/meetings/ holds
#   21 test files and 219 tests, and NO workflow in .github/workflows/ names that
#   directory. Every `vitest run` in this repo names explicit paths, and the only
#   __tests__ directories any job has ever named are __tests__/lib, __tests__/ci,
#   __tests__/api and __tests__/components. All 219 meetings tests were therefore
#   inert: written, passing, and never run by anything on a pull request.
#
#   That is not a gap in coverage, it is a gap in EXECUTION — the same class
#   lib-unit-suite.yml closed for __tests__/lib/**. A PR body could truthfully
#   say "covered by a test" while nothing on the pull request would ever have
#   gone red. This is the meetings half of that hole.
#
#   SCOPE IS DELIBERATELY ONE DIRECTORY. The ruling behind this workflow was
#   "start with meetings only, then widen". Other dark test directories are
#   still dark; widening them is a later pull request, not a quiet edit here.
#
# WHY IT IS A REAL RED X AND NOT ADVISORY
#   An advisory check that cannot fail is the same decoration as a test nothing
#   runs — it would reproduce the very problem it was written to fix. So this job
#   exits non-zero on a genuine failure. Making that safe against the open pull
#   requests meant measuring the suite against unmodified main FIRST and
#   confirming the whole enforced set is green.
#
# WHAT IS ENFORCED
#   All 21 files / 219 tests. There is NO --exclude list here, and that is a
#   measured result rather than an oversight: on unmodified jicate/main at
#   49ae115004, `npx vitest run __tests__/meetings/` reports
#   "Test Files 21 passed (21) / Tests 219 passed (219)" in under two seconds.
#   Every file in the directory is enforced. Contrast lib-unit-suite.yml, which
#   had to quarantine seven files to enforce the rest.
#
# SCOPE. No database, no secret, no network. Every enforced test is pure and
# runs in memory, so this also passes on forks:
#   • no test imports fs, and none calls readFileSync/readdirSync/process.cwd —
#     nothing here reads the repo off disk;
#   • every outbound call is stubbed (vi.stubGlobal('fetch', ...)); the https://
#     strings in these files are assertion fixtures, not requests;
#   • every credential is invented in-process — vi.stubEnv('RAZORPAY_KEY_SECRET',
#     'rzp_test_secret'), stubbed ZOOM_*/MS_GRAPH_* vars, and a self-provisioning
#     `process.env.RESEND_API_KEY ||= 'test-key'`. No repository secret is read,
#     so no file needs excluding on secret grounds.
#
# DETERMINISM. The suite carries no wall-clock or RNG dependency: no `new Date()`,
# no `Date.now()`, no `Math.random()` in any of the 21 files. Because these tests
# had never run in CI, they had also never run outside a developer's local zone,
# so the UTC case was verified explicitly — `TZ=UTC npx vitest run
# __tests__/meetings/` is also 21/219 green. This gate should not flake on pull
# requests that do not touch meetings.
#
# NOTE the workflow `name:` and the job `name:` are the status-check identity
# that branch protection matches on. Renaming either string silently orphans a
# rule pointing at the old name.

on:
  pull_request:
    # ready_for_review is here because of the `if: !draft` guard on the job
    # below. A pull request opened as a draft fires `opened`, the guard skips
    # the job, and marking it ready afterwards fires `ready_for_review` — which
    # is NOT `synchronize`. Without this type the check would never run at all
    # on any PR that started life as a draft, and would sit there un-run rather
    # than red. That is the same silent non-execution this workflow exists to
    # end, so the guard and the trigger list have to agree.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      # The tests themselves.
      - '__tests__/meetings/**'
      - '.github/workflows/meetings-unit-suite.yml'
      - 'vitest.config.js'
      # The code they assert over. Derived by reading the import list of all 21
      # files, not guessed. Every file reaches lib/ — lib/services/meetings/*,
      # lib/services/integrations/{zoom,teams,google-calendar}-service,
      # lib/services/integrations/razorpay-booking-service,
      # lib/services/payments/razorpay/client, lib/supabase/server,
      # lib/services/email/meeting-booking-email-service,
      # lib/services/admission/activity-service, lib/services/contacts/*,
      # lib/sidebarMenuLink and lib/utils/{phone,enhanced-logger}.
      - 'lib/**'
      # Four tests import a server action or a route handler out of app/ DIRECTLY,
      # so an edit there can turn them red without touching lib/ at all:
      #   schedule-people-search.test.ts            -> app/(routes)/meetings/schedule/actions
      #   integration-prefs-actions.test.ts         -> app/(routes)/meetings/availability/_components/integration-prefs-actions
      #   card-scan-note-repeat.test.ts             -> app/api/contacts/card-scan/save/route
      #   card-scan-saved-destination-links.test.ts -> app/api/contacts/card-scan/saved/route  (a dynamic await import())
      # Scoped to the containing directories rather than to those exact filenames
      # so a rename or a split inside them keeps firing this gate. Not widened to
      # the whole meetings module either: each of those files was read, and each
      # imports only from lib/** and node_modules — none reaches sideways into a
      # sibling under app/(routes)/meetings/.
      - 'app/(routes)/meetings/schedule/**'
      - 'app/(routes)/meetings/availability/**'
      - 'app/api/contacts/card-scan/**'
      # Added 2026-09-01 with recurring-series-write-actions.test.ts, which
      # imports the recurring-series server actions out of app/ the same way the
      # four files above do:
      #   recurring-series-write-actions.test.ts -> app/(routes)/meetings/series/actions
      #                                          -> app/(routes)/meetings/series/rules/actions
      # WITHOUT this entry the gate would not fire on a pull request that edits
      # only those actions — which is precisely the pull request the tests exist
      # to catch. That is the same silent non-execution this workflow was written
      # to end, so the path list has to keep up with the import list.
      - 'app/(routes)/meetings/series/**'
      # Deliberately ABSENT: supabase/migrations/** and app/api/cron/**.
      # lib-unit-suite.yml needs those because registry-cron-wiring.test.ts reads
      # the repo off disk. Nothing in this suite does, so no file here can change
      # verdict from a file it never opens.

permissions:
  contents: read

concurrency:
  group: meetings-unit-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: meetings unit tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Positional arguments to `vitest run` are SUBSTRING filters against the
      # file path, not globs — passing '__tests__/meetings/**/*.test.ts' matches
      # nothing. The bare directory prefix is the correct form. Verified on this
      # branch rather than taken on trust: the glob form prints "No test files
      # found, exiting with code 1", so a filter that silently stops matching
      # fails LOUDLY here instead of reporting a green build over zero tests.
      #
      # Read the count in the log, not just the colour. This step is only doing
      # its job when it reports 21 files.
      - name: Run the meetings unit suite
        run: npx vitest run __tests__/meetings/

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::A unit test under __tests__/meetings/ failed."
          echo ""
          echo "This suite was fully green on main when the gate was added"
          echo "(21 files, 219 tests, no exclusions), so a failure here is a"
          echo "change in this pull request, not pre-existing noise."
          echo ""
          echo "Reproduce locally with the same command this job runs:"
          echo "  npx vitest run __tests__/meetings/<the failing path>"
          echo ""
          echo "Do NOT fix a failure by adding an --exclude flag to this job."
          echo "This suite deliberately has no exclusion list. Excluding the"
          echo "failing file would recreate the exact problem the gate exists"
          echo "to remove: a test that is present, passing on paper, and never"
          echo "actually executed. Fix the behaviour, or quarantine the file"
          echo "with the reason written down the way lib-unit-suite.yml does."
