id: R-001
name: Config-primitives-before-per-file
severity: block
project_filter: MyJKKN
related_memory: feedback_read_config_primitives_before_per_file_fixes.md

description: |
  When a fix targets a systemic build/runtime symptom (OOM, build failure,
  Suspense boundary, auth bounce, type-not-found), Claude must FIRST grep
  next.config.ts / vercel.json / tsconfig.json / proxy.ts for an existing
  config primitive that addresses the symptom — instead of patching individual
  files. Caught after #437→#438→#439 OOM saga.

triggers:
  - tool: Edit
    when:
      file_glob_any:
        - "app/**/*.ts"
        - "app/**/*.tsx"
        - "components/**/*.ts"
        - "components/**/*.tsx"
        - "lib/**/*.ts"
      conversation_or_input_regex: "(?i)(\\boom\\b|out of memory|build (fail|error)|Cannot find name 'Promise'|Cannot find name 'Error'|Cannot find name 'Record'|Cannot find module '@/|useSearchParams.*Suspense|bounce.*auth|redirect.*loop)"
    check: |
      # Has a config primitive been read in this session for this symptom?
      STATE_FILE=~/.claude/state/empirical-first/R-001.json
      mkdir -p ~/.claude/state/empirical-first
      [ -f "$STATE_FILE" ] || echo '{"sweeps":[]}' > "$STATE_FILE"
      RECENT_SWEEP=$(jq -r '[.sweeps[] | select(.ts > (now - 1800))] | length' "$STATE_FILE" 2>/dev/null || echo 0)
      if [ "$RECENT_SWEEP" -gt 0 ]; then
        exit 0  # already swept config in last 30 min, allow
      fi
      exit 1  # block — no recent config sweep
    fail_message: |
      🚫 R-001 BLOCKED: Per-file fix without config-primitive sweep.

      You're about to edit an app/lib file in response to a systemic symptom (OOM /
      build / Suspense / auth bounce / type-not-found). Before patching individual
      files, you must check if a config primitive already addresses this:

        grep -E "serverExternalPackages|optimizePackageImports|transpilePackages|webpack:" next.config.ts
        grep -E "extends|paths|moduleResolution|types" tsconfig.json
        grep -E "PUBLIC_PATHS_SET|matcher" proxy.ts (for auth bounce)
        grep -E "buildCommand|env|build" vercel.json

      If a primitive matches, fix THERE (one PR, systemic).
      If no primitive matches, record the sweep and proceed:

        echo "{\"sweeps\":[{\"ts\":$(date +%s),\"symptom\":\"<oom|build|...>\",\"checked\":[\"next.config.ts\",\"tsconfig.json\"]}]}" > ~/.claude/state/empirical-first/R-001.json

      Memory: feedback_read_config_primitives_before_per_file_fixes.md
      Recovery example: PR #439 (single config edit) eliminated the per-file work in #437/#438.

      To bypass for this command (logged): EMPIRICAL_FIRST_BYPASS=1
