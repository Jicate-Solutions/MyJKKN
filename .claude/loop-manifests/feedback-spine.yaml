# Feedback Spine manifest — DISCOVERY PASS 2026-07-13 (read-only; no sim/walk
# has been executed against this manifest yet — unlike scf.yaml, treat asserts
# below as verified-by-inspection, not verified-by-run).
#
# Every fact carries its receipt: file on jicate/main or prod table checked
# via Mgmt API on 2026-07-13.
loop_key: feedback-spine
name: Feedback Spine & intake adapters
prod_ref: kvizhngldtiuufknvehv

# Loop shape (class=intake, tier 3, gates all 'off' in loop_registry):
# 5 adapter crons normalize source rows into ONE spine table; a daily
# subscription-routine classifier fills ai_* columns; downstream loops read.
# loop_edges (prod, 2026-07-13): feedback-spine → scf (fuel), → mess (fuel),
# → ai-pulse (fuel, is_draft=true).
tables:
  input: session_feedback        # primary live source; the other adapter inputs are
                                 # mess_feedback, pp_feedback, ig_dm_messages, Meta Graph
                                 # comments (external) — ALL THREE local ones are EMPTY in
                                 # prod (count=0 each, checked 2026-07-13): adapters are
                                 # scheduled+firing but fuel-starved on those sources.
  action: feedback_events        # the spine. 21 cols verified via information_schema
                                 # 2026-07-13; UNIQUE (source, source_ref) = idempotency key.
                                 # Writes are service_role ONLY (no authenticated write
                                 # policy); SELECT = is_super_admin OR is_admin OR
                                 # (user_has_permission('feedback.view') AND
                                 # role_has_institution_access(institution_id)).
                                 # Migration: supabase/migrations/20260626110000_feedback_spine.sql

# Adapters + workers (all verified on jicate/main):
#   app/api/cron/feedback-adapter-session/route.ts      source='session_feedback' (reads latest 1000 session_feedback; only free_text becomes content)
#   app/api/cron/feedback-adapter-mess/route.ts         source='mess'      (reads mess_feedback — 0 rows in prod)
#   app/api/cron/feedback-adapter-parent/route.ts       source='parent'    (reads pp_feedback — 0 rows in prod; source col misspelled 'institutions_id')
#   app/api/cron/feedback-adapter-ig-dm/route.ts        source='ig_dm'     (reads local ig_dm_messages — 0 rows in prod; no Meta call)
#   app/api/cron/feedback-adapter-ig-comments/route.ts  source='ig_comment' (calls Meta Graph API — consumes external quota)
#   app/api/webhooks/instagram/route.ts                 ALSO ingests IG comments real-time (shared dedup with the cron adapter)
#   lib/services/feedback/feedback-ingest.ts            single write path; upsert ignoreDuplicates on (source,source_ref)
#   app/api/cron/feedback-classify/route.ts             DORMANT/SUPERSEDED — Director decision 2026-06-26
#                                                       (specs/feedback-spine-daily-classify-routine.md): classification
#                                                       runs on the Claude Max SUBSCRIPTION routine, not this paid-API cron.
# Scheduling: NOT vercel.json (grep=0 hits). All 5 adapters fire via
# /api/cron/ai-routine-dispatcher (15-min clock) from ai_routine_schedules —
# prod rows verified 2026-07-13: all enabled=true, last_fired_at=2026-07-13
# (session+mess @ min 405 IST, parent @ 420, ig-dm+ig-comments @ 435).
# The classify SUBSCRIPTION routine has NO ai_routine_schedules row (external
# Mac/Server Claude run); queue receipt 2026-07-13: 108 events with content
# awaiting classification, last ai_processed_at 2026-07-11 02:14 UTC (~2-day
# backlog at discovery time), last ingest 2026-07-13 01:45 UTC.
# Fill rates = feedback_events rows BY SOURCE (prod 2026-07-13; NOT the input
# tables — session_feedback table itself has ~64.5k rows, adapter window is the
# latest 1000): source='session_feedback' n=7319 (531 with content,
# 447 classified) · source='ig_comment' n=963 (963 content, 946 classified) ·
# mess/parent/ig_dm = 0.

sentinel: ZZAUDIT                # prefix for every seeded/submitted identifier

# sim: OMITTED — honest gap, not an oversight. Class=intake has NO measure
# function: loop_registry.gates.m='off' (verified 2026-07-13) and pg_proc has
# no fn matching %feedback%/%spine%/%classify% that computes an outcome delta
# (checked 2026-07-13 — the matches are induction/scf submit/list fns). A sim
# would require a measurer like fn_feedback_spine_measure_* asserting a known
# delta (e.g. classification coverage or sentiment lift), which does not exist.
# The closest mechanical regress today: rolled-back INSERT into feedback_events
# asserting the (source,source_ref) dedup + the classify-queue partial index
# picks it up — but that asserts plumbing, not a measured outcome, so it does
# not qualify as a /loops sim block.

# confound: OMITTED — feedback_events has NO outcome or human-verdict columns
# (all 21 prod columns listed 2026-07-13: the only enrichment is ai_sentiment/
# ai_intent/ai_topic/ai_draft_reply/ai_model/ai_processed_at). Nothing measures
# whether a classification or draft reply changed anything, so a
# not_tried-vs-tried falsification is impossible on this loop today.

# feed_forward: OMITTED — lib/services/feedback/feedback-classify.ts is a pure
# per-event enrichment (content in → sentiment/intent/topic/draft out); it
# reads no prior outcomes, so there is no N+1-conditions-on-N mechanism to
# prove. Feed-forward for spine data lives in the DOWNSTREAM loops (scf,
# ai-pulse) per loop_edges.

walk:
  personas:
    student: test.student@jkkn.ac.in         # /learners/class-feedback is UNGATED on
                                             # purpose (lib/sidebarMenuLink.ts ~line 1493:
                                             # learner lanes have no MENU_PERMISSIONS entry)
    superadmin: test.superadmin@jkkn.ac.in   # /feedback gated by MENU_PERMISSIONS
                                             # '/feedback': 'feedback.view' (sidebarMenuLink.ts
                                             # line 1294) + PermissionGuard module="feedback"
                                             # action="view" (app/(routes)/feedback/page.tsx);
                                             # superadmin passes via is_super_admin. Of the
                                             # custom_roles, ONLY 'ceo' holds feedback.view=true
                                             # (prod check 2026-07-13) — no test.ceo account, so
                                             # superadmin is the only usable dashboard persona.
  hops:
    - { as: student, do: form_submit, page: /learners/class-feedback,
        detail: "submit class feedback with free_text containing 'ZZAUDIT' for an open 48h window session",
        assert_db: "1 new session_feedback row, source='async', free_text LIKE '%ZZAUDIT%'" }
      # Requires test.student to have an attendance-marked session inside the
      # 48h feedback window. If none is open, FALLBACK: seed one sentinel
      # session_feedback row via Mgmt API (service role, course_code='ZZAUDIT1',
      # free_text='ZZAUDIT walk marker') — the adapter treats it identically.
    - { as: superadmin, do: api_get,
        path: "/api/cron/feedback-adapter-session?secret=$CRON_SECRET",
        assert: "http 200 + success:true + inserted>=1",
        assert_db: "feedback_events row source='session_feedback', source_ref=<session_feedback.id>, content LIKE '%ZZAUDIT%', ai_processed_at IS NULL" }
      # Adapter is documented safeToManualTrigger:true (lib/ai-routines/
      # feedback-adapters.ts) — read-then-upsert, idempotent, zero messages.
      # It reads the latest 1000 session_feedback rows by created_at DESC, so a
      # freshly-created sentinel is always in the window.
    - { as: superadmin, do: open_assert, page: /feedback,
        expect: "event visible in Feedback Explorer / Session Feedback source tile; ai_sentiment blank (classification is the DAILY subscription routine — do NOT trigger it in a walk)" }
    - { as: superadmin, do: open_assert, page: /feedback,
        detail: "OPTIONAL next-day re-check, read-only",
        expect: "sentinel event shows ai_sentiment/ai_intent once the subscription classify routine has run (ai_processed_at NOT NULL)" }
  forbidden:
    - "/api/cron/feedback-classify — paid Anthropic API AND superseded by Director decision 2026-06-26 (specs/feedback-spine-daily-classify-routine.md); never fire it from a walk"
    - "/api/cron/feedback-adapter-ig-comments — hits the external Meta Graph API (quota); walk only ever triggers the session adapter"
    - "sending ai_draft_reply to anyone — drafts are human-approval-only by design; no code path auto-sends and a walk must not either"
    - "session-feedback-nudge / session-feedback-escalation routines — they message real users off the same input table"
  cleanup: |
    DELETE FROM feedback_events WHERE content LIKE '%ZZAUDIT%'
       OR source_ref IN (SELECT id::text FROM session_feedback WHERE free_text LIKE '%ZZAUDIT%' OR course_code LIKE 'ZZ%');
    DELETE FROM session_feedback WHERE free_text LIKE '%ZZAUDIT%' OR course_code LIKE 'ZZ%';
    -- verify in a SEPARATE call: both sentinel counts = 0.
  notes:
    - Delete ORDER matters — feedback_events first (its source_ref subquery
      needs the session_feedback rows still present).
    - RESURRECTION trap — deleting only the feedback_events row leaves the
      sentinel session_feedback row for the nightly adapter (min 405 IST) to
      re-ingest; cleanup MUST remove the source row too, in the same session.
    - source_ref is TEXT with no FK — cast session_feedback.id::text when matching.
    - The dashboard reads via the BROWSER client under RLS — a non-admin
      persona without feedback.view gets the PermissionGuard hard "no access"
      panel (explicit, not a silent redirect).

registry_gates_hint: '{"a":"off","f":"off","g":"off","m":"off"}'  # actual prod loop_registry state 2026-07-13; intake class — ingestion+classification are LIVE even with gates off (gates describe generate/act/measure/feed-forward stages this loop does not have)
