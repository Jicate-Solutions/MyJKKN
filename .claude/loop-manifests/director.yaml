# Director's allocation loop manifest — DISCOVERY PASS 2026-07-13 (no sim/walk
# has been executed against this manifest yet; every fact below carries its
# receipt: a prod-DB query via Mgmt API or a file read from jicate/main).
#
# WHAT THIS LOOP IS (registry row, verified live): stack_tier=5,
# loop_class=infrastructure, domain=governance — "Set goals, allocate, cull —
# decisions flow down; measured outcomes flow up." It is a STACK ANCHOR, not a
# goal loop (migration 20260710233000_loop_registry_edges_audits.sql seeds it
# under the comment "stack anchors (not goal loops)"). The human at the top IS
# the mechanism: measured outcomes reach the Director through /admin/loops
# (tower + wiring, jicate/main app/(routes)/admin/loops/), and decisions flow
# down as loop_registry/gates edits (service-role only — no write RLS),
# config flips, and PRs (receipts: #1958's 8 Director decisions, the D2 gate
# flip, and the tier-5 band blurb in loop-tower.tsx:204, which lists verbatim
# "nudges off, model pins, the Max-lane night chain, no-limit spine minting").
#
# Distinct from loop_key='decisions' ("Director Decisions Verdict"): that
# sibling loop owns fn_decision_outcome_check + the director_decisions grading
# lane. This manifest references that substrate only where the two loops share
# it (the decision-logging lane), and says so at each point.
loop_key: director
name: Director's allocation loop
prod_ref: kvizhngldtiuufknvehv

tables:
  # Where measured outcomes enter the Director's view: loop_audits rows are the
  # harness verdicts the tower shows per ring (table verified in prod; only
  # scf rows exist as of 2026-07-13 — 4 rows, latest sim 2026-07-12).
  # Secondary inputs, same page: loop_registry.gates (health chips) and the
  # live counts /admin/loops/page.tsx pulls per card.
  input: loop_audits
  # Where allocation decisions live AS DATA: director_decisions (schema
  # verified via information_schema — alternatives jsonb, predicted_outcome,
  # outcome_metric_query jsonb, outcome_due_at, actual_outcome_value,
  # prediction_correct, verdict_notes; RLS = self-only auth.uid()=
  # director_user_id for SELECT/INSERT/UPDATE, verified in pg_policy).
  # Fill-rate (verified 2026-07-13): 4 rows TOTAL, 1 distinct director, ALL
  # dated 2026-04-25 (the spec's seed decisions); 2 pending_outcome,
  # 2 outcome_recorded/graded. No new decisions logged in ~11 weeks — the
  # decision-logging lane is fuel-starved.
  # The OTHER action surface is loop_registry itself (fund/cull = is_active,
  # pin = gates edits) — service-role writes only, done in Director interviews
  # via Mgmt API, not through any UI.
  action: director_decisions

# sim: OMITTED — honestly. No measure function exists for THIS loop.
# Verified by pg_proc sweep (proname ILIKE '%director%'/'%decision%'/'%loop%'):
# the only related fns are fn_decision_outcome_check + fn_decision_resolve_metric
# (they belong to loop_key='decisions' — sim them THERE, not here),
# fn_arps_log_director_action (loop_key='arps'), and a trigger helper.
# Registry gates.m='half' agrees. For a director sim to exist, someone would
# need to build an allocation-outcome measurer (e.g. fn_director_measure_
# allocation_outcomes) that grades each fund/cull/pin registry change against
# a pre-registered metric — until then, regress coverage for this loop is
# vacuous by design and MUST NOT be faked against the decisions loop's fn.

confound:
  # Outcome + verdict columns DO exist on the decision lane:
  # actual_outcome_value (numeric) + prediction_correct (boolean) +
  # verdict_notes — verified via information_schema 2026-07-13.
  # CAVEAT: this substrate is shared with loop_key='decisions'; a confound
  # verdict here is about the Director's PREDICTION CALIBRATION, not about
  # whether allocations caused outcomes.
  verdict_column: prediction_correct
  query: |
    SELECT status, prediction_correct, count(*) AS n,
           round(avg(actual_outcome_value),2) AS avg_outcome
    FROM director_decisions
    GROUP BY 1, 2 ORDER BY 1, 2;
  min_rows: 10
  # Current fuel = 4 rows (2 graded) — BELOW min_rows. Expected report until
  # more decisions are logged: "insufficient fuel", never a calibration claim.

# feed_forward: OMITTED as an automated block — the F gate is 'on' because the
# feed-forward is HUMAN: the Director demonstrably changes the next allocation
# after seeing measured outcomes (receipts: the 2026-07-10 registry migration
# itself was a Director-interview decision; #1958's 8 decisions; the tier-5
# blurb's "nudges off, model pins, Max-lane night chain"). There is no reader
# fn to trigger and no API that generates the next decision — proving F here
# means citing decision receipts, not calling an endpoint.

walk:
  personas:
    superadmin: test.superadmin@jkkn.ac.in   # /admin/loops gate: profile.is_super_admin===true OR role==='super_admin' (page.tsx); MENU_PERMISSIONS '/admin/loops'->'super_admin' (lib/sidebarMenuLink.ts:451)
    hod: test.hod@jkkn.ac.in                 # negative check — must see the explicit restriction fallback, not a silent redirect
  hops:
    - { as: superadmin, do: open_assert, page: /admin/loops,
        expect: "tier band '5 · Allocation' / 'The Director's loop' renders at the top of the tower (loop-tower.tsx)" }
    - { as: superadmin, do: open_assert, page: /admin/loops?view=wiring,
        expect: "director node ('Director's allocation loop') rendered top-center; metaloop→director measured_outcomes edge + director→metaloop decisions edge drawn; ai-pulse→director escalations edge DASHED (is_draft=true in loop_edges, verified). While metaloop gates.m != 'on' (currently 'half', verified 2026-07-13), the 'Open seam' banner names MetaLoop and the director ring renders DIMMED — that is loop-wiring.tsx seam logic working, not a bug." }
    - { as: superadmin, do: sql_read, via: mgmt_api,
        detail: "SELECT from_key,to_key,what_flows,is_draft FROM loop_edges WHERE 'director' IN (from_key,to_key)",
        assert_db: "exactly 3 rows: metaloop→director/measured_outcomes (firm), director→metaloop/decisions (firm), ai-pulse→director/escalations (draft) — verified state 2026-07-13" }
    - { as: hod, do: open_assert, page: /admin/loops,
        expect: "explicit 'restricted to super administrators' message (permission-UX rule: never a silent redirect)" }
    # OPTIONAL, prod-write, gate per-run: the decision lane has NO UI or API
    # surface on jicate/main (grep: director_decisions appears only in
    # admin/loops/page.tsx, the decisions-verdict-check cron, types, and
    # non-runtime files — specs/decisions-spec.md + supabase/setup SQL).
    # Walking it therefore means an impersonated SQL INSERT (RLS insert-self
    # passes for any authed user). If run: outcome_due_at MUST be far-future
    # so the 09:30-IST decisions-verdict-check cron never grades the sentinel
    # and never emits a dashboard work item.
    - { as: superadmin, do: sql_insert, via: mgmt_api_impersonated, optional: true,
        detail: "INSERT sentinel director_decisions row, title 'ZZAUDIT …', outcome_due_at = now()+interval '10 years'",
        assert_db: "row visible ONLY to its director_user_id (RLS self-only, verified in pg_policy); tower 'decisions tracked' count +1 on reload" }
  forbidden:
    - dashboard work-item verdict notifications (fn_decision_outcome_check emits fn_create_dashboard_work_item to the decision owner — never seed a due sentinel)
    - loop_audits rows with non-verified verdicts written casually (loop-watchdog cron, daily 09:23 IST, notifies super admins on non-verified audits)
    - any edit to loop_registry gates/is_active during a walk (that IS a Director allocation decision — walks observe, they do not allocate)
  cleanup: |
    DELETE FROM director_decisions WHERE title LIKE 'ZZAUDIT%';
    -- verify in a SEPARATE call: sentinel count = 0; total back to pre-walk
    -- baseline (4 rows as of 2026-07-13; compare sentinel count, not totals).
  notes:
    - "DISCOVERED TRAP (reported, not hotfixed): /admin/loops/page.tsx counts director_decisions .eq('status','graded') for the decisions card's 'graded' tile, but the CHECK constraint vocabulary is pending_outcome|outcome_recorded|reversed|superseded (verified in pg_constraint) — 'graded' is an invented enum value, so that tile reads 0 forever; the 2 really-graded rows have status='outcome_recorded'. The invented-enum bug class from memory."
    - "loop_audits has NO director rows yet (only scf) — the tower shows no last-tested state for this ring; that is accurate, not broken."
    - "b2a_decision_log (app/api/b2a/memory/decisions) is a DIFFERENT table/lane (agent memory, API-key auth) — do not confuse it with director_decisions."

registry_gates_hint: '{"g":"on","a":"on","m":"half","f":"on"}'  # verified live 2026-07-13
