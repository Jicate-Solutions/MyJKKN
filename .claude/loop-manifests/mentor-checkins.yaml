# Cadence plumbing (the loop's actual moving parts, all verified):
cadence:
  generator:
    fn: fn_induction_generate_monthly_checkins(p_event_id)   # pg_proc, body read
    trigger: manual button "Schedule monthly check-ins" on /events/induction/[id]/mentors
    authz: fn_induction_can_manage_training = is_super_admin OR is_admin OR
      (induction.manage + role_has_institution_access) OR event coordinator
  rollover:
    cron: /api/cron/induction-mentorship-rollover              # jicate/main file read
    schedule: "17 3 * * *"                                     # vercel.json verified
    fn: fn_induction_close_ended_mentorships()                 # flips is_active=false,
      # ended_reason='academic_year_end', deletes the mentor's group rows.
      # Correctness does NOT depend on the cron: the mentor write RPCs also
      # gate live on academic_years.end_date (verified in
      # fn_induction_volunteer_mark_attendance's P2c lifecycle gate).
  mentee_write:
    fn: fn_induction_submit_mentor_month_feedback(session, rating, comment)
    gates: [learner only, session kind='mentor_checkin', start_at <= now(),
            enrolled in the event, has a mentor group row]
  mentor_write:
    fn: fn_induction_volunteer_mark_attendance(session, marks)
    gates: [active volunteer row, is_trained (P2b), academic year not ended (P2c)]
  oversight_read:
    fn: fn_induction_mentor_helpfulness_crosscheck(p_event_id) # admin/coordinator only
    flag_rule: "avg_rating >= 4 AND NOT mentor_checked_in"

edges: []
  # loop_edges re-verified 2026-07-13 (exact from_key/to_key match AND ILIKE
  # %mentor%/%checkin% sweep): ZERO rows reference this loop. It is unwired in
  # the loop graph. (An earlier draft of this manifest claimed one draft edge
  # to 'decisions' — that row does not exist; corrected.) No escalation
  # mechanism exists in code either: no fn/cron/UI writes a decision or
  # escalation from this loop's tables.

walk:                            # persona circuit — pages verified on jicate/main
  personas:
    student: test.student@jkkn.ac.in        # mentee lane
    superadmin: test.superadmin@jkkn.ac.in  # admin lane (is_super_admin bypass)
    # mentor lane: NO test.* account holds an induction_feedback_volunteers row
    # (checked 2026-07-13) — walk the mentor lane via see-as-user on a REAL
    # active mentor (19 exist), READ-ONLY, or skip it.
  data_prereqs:
    # Verified 2026-07-13: test.student has learner_id
    # ef63c330-6611-4176-a595-2ed5339d7e38 but is NOT enrolled in event
    # d0d995a9-… and is in NO mentor group -> both learner cards render null
    # for them today. Also: no beat is due before 2026-08-15, so the mentee
    # card is invisible to EVERYONE until then
    # (fn_induction_my_mentor_checkins filters start_at <= now()).
    # UNIQUE constraints that shape any seed (pg_constraint verified):
    #   induction_enrollment UNIQUE (event_id, learner_id)
    #   induction_feedback_volunteer_group UNIQUE (event_id, learner_id)
    #     -> a fresher has exactly ONE mentor per event.
    - "mentee hops need: enrollment + group assignment for the persona AND a due beat"
    # To walk the mentee form_submit BEFORE 2026-08-15 you would have to seed a
    # BACKDATED sentinel check-in (event_sessions kind='mentor_checkin',
    # start_at < now()) — CAUTION: while it exists it is visible in all 19 real
    # mentors' lanes (fn_induction_my_volunteer_sessions lists EVERY session of
    # the event). Short window + same-session delete, or wait for a real beat.
  hops:
    - { as: superadmin, do: open_assert, page: "/events/induction/d0d995a9-8ab4-4ee8-a90b-e63f42a29d46/mentors",
        expect: "mentor roster (19), mentee assignments, 'Schedule monthly check-ins' button,
                 check-in counter = 10; crosscheck table EMPTY until ratings exist (HAVING count(f.id) > 0)" }
    - { as: student, do: open_assert, page: "/learners/my-induction",
        expect: "SeniorPeerMentorCard + MentorMonthFeedbackCard both render NOTHING
                 for an unassigned learner (self-scoping null-render is the PASS
                 condition today, not a failure)" }
    - { as: student, do: form_submit, page: "/learners/my-induction",
        detail: "ONLY once assigned + a beat is due (>= 2026-08-15): rate 1-5 on the month row",
        assert_db: "1 row in induction_mentor_month_feedback (session_id, learner_id) upserted" }
    - { as: mentor(see-as-user), do: open_assert, page: "/my-induction-feedback",
        expect: "duties lane lists the Monthly Check-in sessions among covered
                 sessions (fn_induction_my_volunteer_sessions joins ALL event_sessions
                 of the mentor's event, incl. kind='mentor_checkin')" }
  forbidden:
    # Real-user side effects a walk must never trigger (each verified as a real
    # write path; note the input table itself has NO nudge/digest triggers —
    # only touch_updated_at — checked pg_trigger 2026-07-13):
    - "clicking 'Schedule monthly check-ins' on a REAL event (creates real event_sessions rows every fresher sees)"
    - "marking attendance for real freshers (event_session_attendance feeds induction completion recompute)"
    - "submitting a month rating as/for a real fresher (upsert silently overwrites their real rating)"
    - "appoint/remove/autobalance volunteers on the admin page (mutates the live mentor roster)"
  cleanup: |
    -- Only needed if a rating was submitted with a test learner:
    DELETE FROM induction_mentor_month_feedback WHERE learner_id = '<test learner_id>';
    -- verify in a SEPARATE call: count restored to pre-walk value (0 as of 2026-07-13).

registry_gates_hint: '{"g":"on","a":"on","m":"off","f":"off"}'   # loop_registry read 2026-07-13
