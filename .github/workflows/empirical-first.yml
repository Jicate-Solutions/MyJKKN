name: Empirical-First Gate

# Reads .rules/*.yaml and evaluates each rule's `layer2_pr` trigger against the
# PR's diff + title. Posts a comment if violations found. Optionally fails the
# check if any rule has severity: block.
#
# Rules are mirrored from ~/.claude/projects/-Users-omm-PROJECTS-MyJKKN/rules/
# by the local pre-push hook (see .git/hooks/pre-push).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Merge queue (2026-07-11): rules re-evaluate on the queue's merged tree.
  # The queue event carries no PR object — the PR number is parsed from the
  # queue branch name (gh-readonly-queue/main/pr-N-…) and the title fetched
  # via gh, so title-triggered rules keep working. Inert until the merge
  # queue is enabled on the repo.
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: write
  contents: read

jobs:
  empirical-first:
    name: Empirical-First Rule Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can diff against main

      - name: Skip if .rules/ doesn't exist
        id: check_rules
        run: |
          if [ ! -d .rules ]; then
            echo "no_rules=true" >> $GITHUB_OUTPUT
            echo "::notice::No .rules/ directory found. Skipping empirical-first gate."
            exit 0
          fi
          echo "no_rules=false" >> $GITHUB_OUTPUT

      # Merge-queue runs have no pull_request context. The queue branch name
      # encodes the PR number (gh-readonly-queue/main/pr-N-<sha>); parse it and
      # fetch the title so title-triggered rules evaluate identically. A real
      # fetch (not a pass-through) — a vacuously-passing gate is worse than a
      # missing one.
      - name: Resolve PR context (merge queue)
        if: github.event_name == 'merge_group' && steps.check_rules.outputs.no_rules != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          PR_NUM=$(sed -E 's#.*/pr-([0-9]+)-.*#\1#' <<< "$MG_HEAD_REF")
          [[ "$PR_NUM" =~ ^[0-9]+$ ]] || { echo "::error::Cannot parse PR number from '$MG_HEAD_REF'"; exit 1; }
          echo "MG_PR_NUMBER=$PR_NUM" >> "$GITHUB_ENV"
          {
            echo "MG_PR_TITLE<<MG_CTX_EOF"
            gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json title --jq .title
            echo "MG_CTX_EOF"
          } >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.check_rules.outputs.no_rules != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        if: steps.check_rules.outputs.no_rules != 'true'
        run: pip install pyyaml

      - name: Evaluate rules against PR
        if: steps.check_rules.outputs.no_rules != 'true'
        id: evaluate
        env:
          # pull_request → event fields; merge_group → resolved via gh above
          # (MG_* from GITHUB_ENV) and the group's parent/head SHAs.
          PR_TITLE: ${{ github.event.pull_request.title || env.MG_PR_TITLE }}
          PR_NUMBER: ${{ github.event.pull_request.number || env.MG_PR_NUMBER }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python3 <<'PY'
          import os, re, subprocess, sys, json
          from pathlib import Path
          import yaml

          PR_TITLE = os.environ.get("PR_TITLE", "")
          BASE_SHA = os.environ.get("BASE_SHA", "")
          HEAD_SHA = os.environ.get("HEAD_SHA", "")

          # Get list of changed files in this PR
          diff = subprocess.run(
              ["git", "diff", "--name-only", f"{BASE_SHA}...{HEAD_SHA}"],
              capture_output=True, text=True, check=False,
          )
          changed_files = [f for f in diff.stdout.strip().split("\n") if f]
          print(f"::group::Changed files ({len(changed_files)})")
          for f in changed_files[:50]:
              print(f"  {f}")
          if len(changed_files) > 50:
              print(f"  ... and {len(changed_files) - 50} more")
          print("::endgroup::")

          rules_dir = Path(".rules")
          violations = []  # list of dicts with id, name, severity, message

          for rule_file in sorted(rules_dir.glob("R-*.yaml")):
              try:
                  rule = yaml.safe_load(rule_file.read_text())
              except Exception as e:
                  print(f"::warning::Failed to parse {rule_file}: {e}")
                  continue

              rid = rule.get("id", rule_file.stem)
              rname = rule.get("name", "")
              severity = rule.get("severity", "warn")

              for trigger in rule.get("triggers", []):
                  layer2 = trigger.get("layer2_pr") or {}
                  if not layer2:
                      continue

                  title_re = layer2.get("pr_title_match")
                  required_globs = layer2.get("require_diff_includes_one_of", [])
                  fail_msg = layer2.get("fail_message", trigger.get("fail_message", "Rule violated."))

                  if title_re:
                      if not re.search(title_re, PR_TITLE, re.IGNORECASE):
                          continue  # title doesn't match, this trigger doesn't apply

                  # Check that diff includes at least one of the required files
                  if required_globs:
                      from pathlib import PurePath
                      def matches_any(p, globs):
                          return any(PurePath(p).match(g) or g in p for g in globs)
                      if any(matches_any(f, required_globs) for f in changed_files):
                          continue  # required file IS in diff, allow
                      # Otherwise — required file MISSING → violation
                      violations.append({
                          "id": rid,
                          "name": rname,
                          "severity": severity,
                          "message": fail_msg,
                          "title": PR_TITLE,
                          "required_globs": required_globs,
                      })

          # Write count to GITHUB_OUTPUT for the comment step's `if` predicate.
          # Write the JSON to a file (not GITHUB_OUTPUT) — avoids escape-layer
          # corruption when ${{ steps.evaluate.outputs.violations }} gets
          # interpolated into a JS template literal (newlines break JSON.parse).
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"violation_count={len(violations)}\n")
          with open("violations.json", "w") as f:
              json.dump(violations, f)

          # Print human-readable summary
          if not violations:
              print("::notice::Empirical-First Gate: no violations.")
              sys.exit(0)

          print(f"::warning::Empirical-First Gate found {len(violations)} violation(s):")
          for v in violations:
              prefix = "::error::" if v["severity"] == "block" else "::warning::"
              print(f"{prefix}{v['id']} ({v['name']}): {v['message'][:200]}...")

          # Decide exit code: block if any violation has severity:block
          blocking = [v for v in violations if v["severity"] == "block"]
          if blocking:
              sys.exit(1)
          # warn-only violations: don't fail
          sys.exit(0)
          PY

      - name: Comment on PR
        # pull_request only: in a merge-queue run context.issue.number is
        # undefined (github-script would throw). Violations still fail the
        # check itself above — the queue removes the PR; the comment already
        # exists from the PR-level run.
        if: always() && github.event_name == 'pull_request' && steps.evaluate.outputs.violation_count != '0' && steps.evaluate.outputs.violation_count != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const violations = JSON.parse(fs.readFileSync('violations.json', 'utf8'));
            const lines = [
              "## ⚠️ Empirical-First Gate",
              "",
              `Found ${violations.length} rule violation(s):`,
              "",
            ];
            for (const v of violations) {
              const sev = v.severity === "block" ? "🚫 BLOCK" : "⚠️ WARN";
              lines.push(`### ${sev} ${v.id} — ${v.name}`);
              lines.push("");
              lines.push("```");
              lines.push(v.message);
              lines.push("```");
              lines.push("");
            }
            lines.push("---");
            lines.push("Bypass (logged): comment with `/empirical-first bypass <reason>`");
            lines.push("");
            lines.push("See `.rules/README.md` for rule definitions.");

            const body = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === "Bot" && c.body.includes("Empirical-First Gate")
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
