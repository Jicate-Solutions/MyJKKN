name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      # Regenerate route manifest from PR's filesystem so reachability check
      # sees the actual state of the PR's pages, not the merged-in manifest.
      - name: Regenerate route manifest
        run: npm run gen:routes

      # Catches "ghost page" merges — pages that exist on disk but aren't
      # reachable from any sidebar/chip click sequence. Was caught only at
      # Vercel deploy time before (PR #735, #736 fees-structure/new), which
      # blocked deploys 2+ days after merge. Now fails the PR before merge.
      - name: Check nav reachability
        run: npm run check:reachability

      # Catches sidebar config drift (entries pointing at deleted pages).
      - name: Check sidebar coverage
        run: npm run check:sidebar

      # Catches modules that fail audit-coverage thresholds.
      - name: Check audit coverage
        run: npm run check:audit-coverage

      - name: Check admission-counselor membership contract
        run: npm run check:admission-counselor-membership

      - name: Check bug-module classifier parity
        # Verifies bug_reports.module_name CASE in supabase/setup/01_tables.sql
        # covers every slug in MODULES (lib/navigation/modules.ts). Without this,
        # adding a new top-level module silently misclassifies its bugs as 'other'.
        # See scripts/check-bug-module-classifier.mjs header for the full diagnostic
        # and the 2026-05-05 audit that surfaced 22 missing slugs / 1,201 mis-tagged bugs.
        run: node scripts/check-bug-module-classifier.mjs
