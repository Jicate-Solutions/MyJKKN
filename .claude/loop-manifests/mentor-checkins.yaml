loop_key: mentor-checkins
name: Senior Peer Mentor Check-in Loop
prod_ref: kvizhngldtiuufknvehv
loop_class: cadence            # loop_registry.loop_class (row read 2026-07-13)
domain: induction

tables:
  # input = the monthly mentee signal ("did your mentor help you this month?")
  # rating 1-5 NOT NULL + optional comment; UNIQUE (session_id, learner_id)
  # via fn_induction_submit_mentor_month_feedback's ON CONFLICT upsert.
  # Verified cols: id, event_id, session_id, learner_id, volunteer_id,
  # institution_id, rating, comment, created_at, updated_at. NO outcome/lift/
  # verdict columns exist on this table (checked information_schema 2026-07-13).
  input: induction_mentor_month_feedback
  # action/cadence = the monthly beats themselves: event_sessions rows with
  # kind='mentor_checkin', created by fn_induction_generate_monthly_checkins
  # (15th of each month 10:00-11:00, from the month after the last induction
  # session through the freshers' first academic-year end; idempotent per month).
  action: event_sessions        # WHERE kind='mentor_checkin'
  # supporting roster tables (all verified in information_schema):
  #   induction_feedback_volunteers        — the mentors (is_active, is_trained,
  #     academic_year_id, ended_at, ended_reason). 19 active rows 2026-07-13.
  #   induction_feedback_volunteer_group   — mentor->fresher assignment. 425 rows.
  #   event_session_attendance             — mentor's check-in proof (marked_by =
  #     mentor's auth uid via fn_induction_volunteer_mark_attendance).

