name: Claude Deep Review (SDK multi-agent · pilot)

# PILOT: true multi-agent PR reviewer built on the Claude Agent SDK.
# Spawns THREE genuinely independent lens agents in parallel (separate contexts)
# + a judge with strict 2-of-3 consensus — the real "dynamic workflow" the
# prompt-driven claude-risk-review.yml deep tier could only simulate (a single
# Opus agent role-played the lenses; verified via run logs 2026-06-14: 7 turns,
# 0 subagent spawns).
#
# Runs ALONGSIDE the existing reviewer during the pilot (distinct comment marker
# <!-- claude-deep-review-sdk -->) so output quality can be compared head-to-head
# before retiring the prompt-driven deep tier.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Claude Max). No API key. Draws from the Max
# monthly Agent SDK credit pool, separate from interactive usage.
# Advisory — posts a comment, never blocks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: claude-deep-review-sdk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  route:
    name: Deep-tier router
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      deep: ${{ steps.classify.outputs.deep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          DOCS_REGEX='^(docs|specs)/.*\.(md|mdx|txt|png|jpe?g|gif|svg|pdf)$|^\.screenshots/|^(README\.md|CHANGELOG\.md|LICENSE)$|\.md$'
          RISK_REGEX='^(supabase/migrations/|supabase/setup/|lib/auth/|app/auth/|app/api/auth/|(middleware|proxy)\.ts$|utils/supabase/)'
          MONEY_REGEX='(^|[/_.-])(fees?|billing|payments?|invoices?|scholarships?|payroll)([/_.-]|$)'
          NON_DOCS=$(echo "$CHANGED" | grep -vE "$DOCS_REGEX" || true)
          DEEP=$( { echo "$NON_DOCS" | grep -E "$RISK_REGEX" || true; echo "$NON_DOCS" | grep -iE "$MONEY_REGEX" || true; } | grep -ivE '\.(png|jpe?g|gif|svg|webp)$' | grep -v '^$' | sort -u || true )
          if [[ -n "$DEEP" ]]; then echo "deep=true" >> "$GITHUB_OUTPUT"; else echo "deep=false" >> "$GITHUB_OUTPUT"; fi
          echo "::notice::deep=$([[ -n "$DEEP" ]] && echo true || echo false)"

  deep-review:
    name: SDK multi-agent review
    needs: route
    if: needs.route.outputs.deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = "true" ] || echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN — skipping."

      - name: Setup Node
        if: steps.token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Agent SDK + CLI
        if: steps.token.outputs.has_token == 'true'
        run: npm install -g @anthropic-ai/claude-agent-sdk @anthropic-ai/claude-code

      - name: Generate PR diff
        if: steps.token.outputs.has_token == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          git diff "origin/$BASE_REF...HEAD" > /tmp/pr.diff
          echo "diff bytes: $(wc -c < /tmp/pr.diff)"

      - name: Run multi-agent review
        if: steps.token.outputs.has_token == 'true'
        continue-on-error: true   # advisory — never redden the PR
        timeout-minutes: 25
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_PATH: /usr/local/lib/node_modules
          DIFF_FILE: /tmp/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          APP_CONTEXT: "a production multi-tenant college ERP (MyJKKN)"
        run: node .github/scripts/deep-review.mjs

      - name: Post review comment (idempotent)
        if: steps.token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/claude-review.md ]; then
            echo "::warning::No review file produced — advisory, ending green."
            exit 0
          fi
          EXISTING_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq '.[] | select(.body | startswith("<!-- claude-deep-review-sdk -->")) | .id' 2>/dev/null | tail -n1 || echo "")
          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" -F body=@/tmp/claude-review.md > /dev/null
            echo "::notice::Updated comment #$EXISTING_ID"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review.md
            echo "::notice::Posted new comment"
          fi
