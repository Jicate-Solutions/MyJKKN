# information_schema, pg_proc, live counts) and jicate/main (git show) on
# 2026-07-13. The walk block is a DESIGNED circuit from the verified code
# (migration 20260708123000_induction_referral_desk_wiring.sql, PR #1887,
# plus the #1912 anti-self-referral hardening now live in
# fn_induction_submit_referral) — it has NOT yet been executed. First
