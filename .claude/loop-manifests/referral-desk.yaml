# ADVERSARIAL VERIFY 2026-07-13: all tables/columns/functions/routes/personas/
# gates/fuel counts re-confirmed against prod + jicate/main. 3 in-place fixes:
# (1) fn_get_policy_text needs 2 args, (2) desk owner NOT visible in the leads
