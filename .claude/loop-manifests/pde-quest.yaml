walk:
  personas:
    student: test.student@jkkn.ac.in        # role student, has institution (profiles checked 2026-07-13)
    reviewer: test.hod@jkkn.ac.in           # role hod — IS in the reviewer role array of fn_pde_review_queue + fn_pde_validate_demonstration
    superadmin: test.superadmin@jkkn.ac.in  # is_super_admin=true, institution NULL
    # TRAP: test.faculty@jkkn.ac.in is role 'staff_counselor' (profiles, 2026-07-13)
    # — NOT in the reviewer array ('super_admin','administrator','institution_admin',
    # 'dean','hod','coordinator','faculty') → cannot see the review queue or
    # validate. Use test.hod for the reviewer hops.
  hops:
    # Page reachability receipt: layouts DO exist under app/(routes)/pde/**
    # (pde/layout.tsx = plain pass-through; pde/admin/layout.tsx = AdminCategoryNav
    # chrome only) but NEITHER mounts RoutePermissionGuard — no permission guard
    # anywhere under the pde tree on jicate/main (read 2026-07-13; the guard is
    # opt-in per-module and PDE is absent from
    # __tests__/lib/auth/route-permission-guard-access.test.ts GATED list;
    # no root middleware.ts on jicate/main). MENU_PERMISSIONS maps
    # /pde/learn/demonstrations → 'pde.profile.view' etc. (lib/sidebarMenuLink.ts
    # ~L1230), but in custom_roles ONLY role_key='ceo' has any pde.* key = true —
    # student/faculty/hod/principal all false — so the SIDEBAR entries are hidden
    # for the walk personas; pages must be opened by direct URL. Auth-only access.
    - { as: student, do: form_submit, page: /pde/learn/demonstrations/new,
        detail: "DemonstrationForm → POST /api/pde/demonstrations with submit:true; field is category_key (API 400s on missing category_key) e.g. embodied, skill_name 'ZZAUDIT walk <date>'",
        assert_db: "1 new pde_demonstrations row, skill_name LIKE 'ZZAUDIT%', status='submitted', learner_id=test.student uid, institution_id=student's institution (RLS pde_demonstrations_learner_own is FOR ALL)" }
    - { as: reviewer, do: click, page: /pde/faculty/demonstrations,
        target: "Validate (the faculty page's own inline validate dialog via useValidateDemonstration — NOT the ValidationForm.tsx component, which lives under /pde/admin/demonstrations; decision=validated + raw_score)",
        detail: "queue reads fn_pde_review_queue (SECURITY DEFINER, reviewer+same-institution gate, hides draft/withdrawn); write goes through fn_pde_validate_demonstration RPC — faculty-lane RLS on the table is SELECT-only",
        assert_db: "sentinel row status='validated', raw_score set, validator_ids contains test.hod uid, validator_notes keyed by uid" }
    - { as: superadmin, do: api_post, path: "/api/pde/demonstrations/<sentinel id>/score",
        detail: "PDEScoringService.scoreAndPersist — session-scoped client UPDATE",
        assert: "http 200; row status='scored', weighted_score + passed + scored_at populated" }
        # TRAP (verified 2026-07-13): the score route's comment claims faculty/hod
        # can write, but the ONLY RLS UPDATE policies on pde_demonstrations are
        # pde_demonstrations_learner_own (learner_id=auth.uid(), FOR ALL) and
        # pde_demonstrations_super_admin_all; pde_demonstrations_faculty_same_inst
        # is polcmd='r' (SELECT-only). A hod-called score UPDATE matches no policy
        # → 0 rows → .single() errors. Run this hop as superadmin (or the learner).
    - { as: student, do: open_assert, page: /pde/learn/transcript,
        expect: "the scored ZZAUDIT demonstration appears in the learner transcript / My Demonstrations (loop-closure read-back); /pde/learn/demonstrations also lists it" }
    # OPTIONAL extra read (uncertain, verify before relying on it): hod opening
    # /pde/faculty/dashboard agency distribution calls
    # fn_pde_agency_distribution_for_facilitator, which requires a staff row
    # (staff.profile_id = auth.uid()) — NOT verified that test.hod has one;
    # returns reason='not_teaching_staff' if absent.
  forbidden:
    - "/api/cron/ai-pulse-pde-bridge — creates REAL pde_demonstrations rows from live AI Pulse data (routine ai-pulse-pde-bridge is enabled, fires 10:30 IST daily; policy pde_bridge_enabled=true)"
    - "/api/pde/hod-escalation — notifies real HoDs (NOTE: no /api/cron/pde-hod-escalation route exists on jicate/main — verified via ls-tree 2026-07-13; only the cron-less /api/pde/ path)"
    - "/api/cron/pde-gaming-defense and /api/cron/pde-quest-risk-tier — mutate real quest risk tiers (routes exist on jicate/main; NO schedule found in vercel.json crons nor ai_routine_schedules as of 2026-07-13 — appear unscheduled, do not wake them)"
    - notifications / nudges of any kind
  cleanup: |
    DELETE FROM pde_demonstrations WHERE skill_name LIKE 'ZZAUDIT%';
    -- verify in a SEPARATE Mgmt-API call: sentinel count = 0. Compare SENTINEL
    -- counts only, never table totals — the bridge routine adds real rows daily
    -- (last_status 2026-07-12: "skipped 35, created 0, candidates 35").
  notes:
    - >-
      Demonstration status machine (fn_pde_validate_demonstration + scoring
      service, read 2026-07-13): draft → submitted → under_review →
      validated | rejected | draft (changes_requested returns it) → scored;
      'withdrawn' exists and is hidden from the review queue. Only
      submitted/under_review rows can be reviewed. raw_score required when
      decision='validated'; rejection leaves raw_score untouched.
    - >-
      Quest lane vocabulary (app/api/pde/quests/route.ts + [id]/submit):
      quest status draft → open → archived (publish sets 'open'; students see
      status IN ('open','in_progress'), institution-scoped); enrollment must
      be status='active' before /api/pde/quests/[id]/submit accepts. All of
      this is UNTESTED BY PROD TRAFFIC (0 enrollments/submissions ever).
    - >-
      Bridge idempotency key = evidence.source_key '<cycle>:<profile>:<signal>'
      (ai-pulse-pde-bridge-service.ts) — a walk must never fabricate rows with
      source='ai_pulse' or the daily bridge dedupe becomes ambiguous. Sentinel
      rows use the learner form path only.
    - >-
      Bridge signal map is the pde_bridge_signal_map ai_pulse_policies row
      (engaged_live_session → embodied/scored, weight_multiplier 0.25 =
      quiz×0.25 Director lock 2026-07-10; domain_sync_submitted →
      problem_finding/submitted; gold_selected → social_leadership/validated;
      publication_above_target → cultural_civic/validated).

registry_gates_hint: '{"g":"on","a":"on","m":"off","f":"off"}'
