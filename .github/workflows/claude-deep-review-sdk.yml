name: Claude Deep Review (SDK multi-agent)

# True multi-agent PR reviewer on the Claude Agent SDK: three genuinely
# independent lens agents in parallel + a judge. The real dynamic workflow the
# prompt-driven claude-risk-review.yml deep tier could only simulate (verified
# on PR #1383: that one was 1 agent / 7 turns / 0 spawns; this one runs 3
# concurrent agents with staggered completion and distinct findings).
#
# Judging is NOT a 2-of-3 gate: the lenses have disjoint mandates, so the judge
# keeps full severity for any line-tied finding (even single-lens) and uses
# agreement only to raise confidence. (See the script header.)
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Claude Max). No API key. Draws from the Max
# monthly Agent SDK credit pool, separate from interactive usage.
#
# SECURITY (hardened over PR #1383 by the reviewer reviewing itself):
#  - Runs the TRUSTED base-ref copy of the script, NEVER the PR head copy — a
#    malicious same-repo branch cannot rewrite the script to exfiltrate the
#    token (the pwn_request vector). Fork PRs get no secret at all (token check).
#  - Agents have no file tools; the whole script is crash-guarded to an explicit
#    inconclusive review (never a silent green pass).
#
# HONESTY CONTRACT (2026-07-28): FINDINGS are advisory — a CRITICAL finding still
# leaves this check green and never blocks a merge. A MISSING REVIEW is not. If
# the reviewer produces no review, this job goes RED, because a green tick that
# can never go red means nothing was checked. Before this change the job posted
# "Inconclusive — treat as NOT reviewed" and reported success anyway; every PR
# from 2026-07-26 onward got that comment under a green tick.
#
# HONESTY CONTRACT, PART 2 (2026-08-04): the 07-28 contract only covered PRs the
# router SENT to the panel. A PR the router did NOT send got nothing at all —
# "Deep-tier router" went green, "SDK multi-agent review" showed as *skipped*,
# and no status, comment or annotation anywhere said the words "not reviewed".
# Absence of review was pixel-identical to a passed review. Measured on
# 2026-08-04: of 52 open non-draft PRs, 19 carried ZERO review comment of any
# kind (#2773 #2775 #2776 #2786 #2787 #2788 #2789 #2791 #2798 #2806 #2811 #2706
# #2708 #2709 #2715 #2724 #2725 #2726 #2753) — every one of them green.
#
# The `verdict` job below now ALWAYS publishes a `Deep review status` check run
# whose text distinguishes the three real outcomes:
#   success  "REVIEWED — 3-lens panel completed"       (findings advisory)
#   neutral  "NOT REVIEWED — outside the deep surface" (grey, not red: a
#            legitimately-skipped PR must not be trained-away noise)
#   failure  "NOT REVIEWED — the panel did not complete"
# plus an unmissable PR comment in both NOT-REVIEWED cases, self-deleted the
# moment the PR does get reviewed.
#
# ESCAPE HATCH, deliberately opt-in and one PR at a time: label a PR
# `deep-review` and the panel runs on it regardless of paths. The router surface
# is NOT widened — each deep run spawns 3 concurrent Opus lens agents out of the
# shared Claude Max Agent SDK pool, and ~30 concurrent agents exhausted the
# account's session limit on the morning of 2026-08-04. Honest reporting is
# free; reviewing everything at once is not.

on:
  pull_request:
    # `labeled` powers the opt-in escape hatch. The router job filters label
    # events down to the one label that matters, so adding an unrelated label
    # to a PR does not re-spend SDK agents on a panel that already ran.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

concurrency:
  group: claude-deep-review-sdk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # The verdict job publishes its own check run so "not reviewed" is a row in
  # the checks list, not a line buried in a job log nobody opens.
  checks: write

jobs:
  route:
    name: Deep-tier router
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # A `labeled` event is only interesting when the label just applied is the
    # escape hatch. Skipping the router here also skips `verdict` (which bails
    # when route is skipped), so a stray label cannot overwrite the standing
    # verdict of the run that actually reviewed this commit.
    if: >-
      ${{ !github.event.pull_request.draft
          && (github.event.action != 'labeled'
              || contains(github.event.pull_request.labels.*.name, 'deep-review')) }}
    outputs:
      deep: ${{ steps.classify.outputs.deep }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Classify
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          # Opt-in override. Kept out of the regex logic entirely so the path
          # surface stays auditable and unchanged.
          FORCED: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          DOCS_REGEX='^(docs|specs)/.*\.(md|mdx|txt|png|jpe?g|gif|svg|pdf)$|^\.screenshots/|^(README\.md|CHANGELOG\.md|LICENSE)$|\.md$'
          RISK_REGEX='^(supabase/migrations/|supabase/setup/|lib/auth/|app/auth/|app/api/auth/|(middleware|proxy)\.ts$|utils/supabase/|lib/services/school-defaults-(admin-)?service\.ts)'
          MONEY_REGEX='(^|[/_.-])(fees?|billing|payments?|invoices?|scholarships?|payroll)([/_.-]|$)'
          NON_DOCS=$(echo "$CHANGED" | grep -vE "$DOCS_REGEX" || true)
          DEEP=$( { echo "$NON_DOCS" | grep -E "$RISK_REGEX" || true; echo "$NON_DOCS" | grep -iE "$MONEY_REGEX" || true; } | grep -ivE '\.(png|jpe?g|gif|svg|webp)$' | grep -v '^$' | sort -u || true )

          if [[ -n "$DEEP" ]]; then
            REASON="changed files match the deep surface (migrations / auth / money)"
            IS_DEEP=true
          elif [[ "$FORCED" == "true" ]]; then
            REASON="forced by the \`deep-review\` label"
            IS_DEEP=true
          else
            REASON="no changed file is under supabase/migrations, supabase/setup, lib/auth, app/auth, app/api/auth, utils/supabase, middleware.ts, proxy.ts, school-defaults-service, and none carries a money path segment (fee/billing/payment/invoice/scholarship/payroll)"
            IS_DEEP=false
          fi

          echo "deep=$IS_DEEP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice::deep=$IS_DEEP — $REASON"

          {
            if [[ "$IS_DEEP" == "true" ]]; then
              echo "### 🔬 Deep-tier router: \`deep\` — the SDK panel WILL review this PR"
              echo ""
              echo "Reason: $REASON"
              if [[ -n "$DEEP" ]]; then
                echo ""; echo '```'; echo "$DEEP" | head -30; echo '```'
              fi
            else
              echo "### ⚪ Deep-tier router: \`skip\` — this PR will **NOT** be deep-reviewed"
              echo ""
              echo "This is a routing decision, **not** a passed review. Reason: $REASON"
              echo ""
              echo "To send it to the panel anyway, add the \`deep-review\` label."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deep-review:
    name: SDK multi-agent review
    needs: route
    if: needs.route.outputs.deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Check token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = "true" ] || echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN — skipping."

      - name: Setup Node
        if: steps.token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install SDK + stage TRUSTED base-ref script
        id: stage
        if: steps.token.outputs.has_token == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          mkdir -p /tmp/reviewer && cd /tmp/reviewer
          npm init -y >/dev/null 2>&1
          npm install @anthropic-ai/claude-agent-sdk @anthropic-ai/claude-code --no-audit --no-fund
          # SECURITY: the script that runs with the token MUST be the trusted
          # base-branch version, not the PR's (a branch could rewrite it to leak
          # the token). No PR-head fallback — skip safely if absent on base.
          if git -C "$GITHUB_WORKSPACE" show "origin/$BASE_REF:.github/scripts/deep-review.mjs" > /tmp/reviewer/deep-review.mjs 2>/dev/null \
             && [ -s /tmp/reviewer/deep-review.mjs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Staged trusted base-ref reviewer script ($(wc -c < /tmp/reviewer/deep-review.mjs) bytes)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deep-review.mjs not on $BASE_REF yet — skipping (no untrusted PR-head fallback)."
          fi

      - name: Generate PR diff
        if: steps.token.outputs.has_token == 'true' && steps.stage.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          git diff "origin/$BASE_REF...HEAD" > /tmp/pr.diff
          echo "diff bytes: $(wc -c < /tmp/pr.diff)"

      - name: Run multi-agent review
        id: review
        if: steps.token.outputs.has_token == 'true' && steps.stage.outputs.run == 'true'
        # NOT continue-on-error. That flag used to discard the reviewer's exit
        # code entirely, so even a hard crash reported success. The code is now
        # CAPTURED here and re-raised by the "Honest verdict" step *after* the
        # comment has been posted — the explanation still reaches the PR, and the
        # check still goes red.
        timeout-minutes: 25
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DIFF_FILE: /tmp/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          APP_CONTEXT: "a production multi-tenant college ERP (MyJKKN)"
        run: |
          export PATH="/tmp/reviewer/node_modules/.bin:$PATH"
          set +e
          node /tmp/reviewer/deep-review.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::reviewer exited $code (0 = a review was produced)"

      - name: Post review comment (idempotent, self-dedup)
        id: post
        if: steps.token.outputs.has_token == 'true' && steps.stage.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/claude-review.md ]; then
            # Was: "advisory, ending green" — a green tick for a review that does
            # not exist. Record it and let the verdict step fail the job.
            echo "no_review=true" >> "$GITHUB_OUTPUT"
            echo "::error::No review file was produced at all — nothing to post."
            exit 0
          fi
          # A run can also produce a file that SAYS it reviewed nothing. Detect
          # both the machine marker and the legacy prose, so this still works
          # while an older copy of deep-review.mjs is the trusted base-ref copy.
          if grep -qF '<!-- claude-deep-review-sdk:inconclusive -->' /tmp/claude-review.md \
             || grep -qF 'treat as NOT reviewed' /tmp/claude-review.md; then
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            echo "::error::The reviewer reported INCONCLUSIVE — this PR was not reviewed."
          fi
          mapfile -t IDS < <(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq '.[] | select(.body | startswith("<!-- claude-deep-review-sdk -->")) | .id' 2>/dev/null || true)
          if [ "${#IDS[@]}" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-review.md
            echo "::notice::Posted new comment"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${IDS[0]}" -F body=@/tmp/claude-review.md > /dev/null
            echo "::notice::Updated comment #${IDS[0]}"
            for stale in "${IDS[@]:1}"; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$stale" > /dev/null 2>&1 && echo "::notice::Deleted stale #$stale" || echo "::notice::Stale #$stale already gone"
            done
          fi

      # A green tick on this job must mean "this PR was actually reviewed".
      # Runs last so the explanation comment is already on the PR when it fails.
      - name: Honest verdict (red when no review was produced)
        if: always()
        env:
          HAS_TOKEN:    ${{ steps.token.outputs.has_token }}
          STAGED:       ${{ steps.stage.outputs.run }}
          REVIEW_EXIT:  ${{ steps.review.outputs.exit_code }}
          NO_REVIEW:    ${{ steps.post.outputs.no_review }}
          INCONCLUSIVE: ${{ steps.post.outputs.inconclusive }}
          IS_FORK:      ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -uo pipefail
          fail() { echo "::error title=No review produced::$1"; exit 1; }

          if [ "${HAS_TOKEN:-}" != "true" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::notice::Fork PR — secrets are withheld by design, so no review is possible. Not treated as a regression."
              exit 0
            fi
            fail "CLAUDE_CODE_OAUTH_TOKEN was not available to this run, so nothing was reviewed. Repository owner: re-add or refresh that repository secret."
          fi

          [ "${STAGED:-}" = "true" ] || \
            fail "The trusted base-ref reviewer script (.github/scripts/deep-review.mjs) was not found on the base branch, so nothing was reviewed."

          [ "${NO_REVIEW:-}" != "true" ] || \
            fail "The reviewer produced no review file at all. See the step logs above for the crash."

          [ "${INCONCLUSIVE:-}" != "true" ] || \
            fail "The reviewer reported INCONCLUSIVE — it posted an explanation but did NOT review this PR. Read the posted comment for the reason."

          [ "${REVIEW_EXIT:-}" = "0" ] || \
            fail "The reviewer exited ${REVIEW_EXIT:-<it never ran>}, meaning no complete review was produced."

          echo "::notice::A complete review was produced and posted. (Findings, if any, are advisory and never fail this job.)"

  # ---------------------------------------------------------------------------
  # The whole point of this job: make "this PR was not deep-reviewed" a thing a
  # human can SEE, without making it red. It is a pure reporter — it never fails
  # the workflow itself; the state it found is carried in the check run it
  # publishes and in the PR comment. (The genuine-failure red signal already
  # exists on `SDK multi-agent review` above; duplicating it here would just be
  # two reds for one fact.)
  # ---------------------------------------------------------------------------
  verdict:
    name: Publish review verdict
    needs: [route, deep-review]
    # `always()` so a skipped or failed panel is still reported. Bails when the
    # router was skipped (draft PR, or an unrelated label event) — in those
    # cases the previously published verdict for this commit is still correct
    # and must not be clobbered.
    if: ${{ always() && needs.route.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish honest verdict (check run + PR comment)
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          ROUTE_RESULT:  ${{ needs.route.result }}
          DEEP:          ${{ needs.route.outputs.deep }}
          REASON:        ${{ needs.route.outputs.reason }}
          # Bracket form, not needs.deep-review.result: a hyphen in a job id is
          # ambiguous with subtraction in the expression grammar, and this repo
          # has no other hyphenated `needs.` reference to prove the dot form.
          REVIEW_RESULT: ${{ needs['deep-review'].result }}
          HEAD_SHA:      ${{ github.event.pull_request.head.sha }}
          PR_NUMBER:     ${{ github.event.pull_request.number }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK:       ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          # Fork PRs get a read-only GITHUB_TOKEN: neither a check run nor a
          # comment can be written. Say so in the log rather than dying.
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice::Fork PR — GITHUB_TOKEN is read-only, so no verdict can be published. This PR was NOT deep-reviewed (secrets are withheld from forks by design)."
            exit 0
          fi

          NOT_REVIEWED=true
          if [ "$ROUTE_RESULT" != "success" ]; then
            CONCLUSION=failure
            TITLE="NOT REVIEWED — the deep-tier router did not complete"
            BODY="The router job ended \`$ROUTE_RESULT\`, so no routing decision was made and **no review of any kind ran**. This is a CI fault, not a verdict on the code."
          elif [ "$DEEP" != "true" ]; then
            CONCLUSION=neutral
            TITLE="NOT REVIEWED — outside the deep-review surface"
            BODY="The 3-lens SDK panel **did not look at this PR**. That is a routing decision, not an approval, and it says nothing about whether the code is correct.\n\n**Why:** $REASON"
          elif [ "$REVIEW_RESULT" = "success" ]; then
            CONCLUSION=success
            TITLE="REVIEWED — 3-lens SDK panel completed"
            BODY="The panel reviewed this PR and posted its findings as a PR comment. Findings are advisory and never block a merge."
            NOT_REVIEWED=false
          else
            CONCLUSION=failure
            TITLE="NOT REVIEWED — the panel did not complete"
            BODY="This PR was routed to the deep panel, but the reviewer job ended \`$REVIEW_RESULT\`, so **no complete review exists**. Common cause on this repo: the shared Claude Max Agent SDK session pool is exhausted (each deep run spawns 3 concurrent Opus agents)."
          fi

          # Multi-line text is assembled with \n escapes and printf %b: a bare
          # newline inside these strings would sit at column 0 and silently
          # terminate this YAML block scalar.
          HATCH="**What did happen instead:** the sibling \`Claude Risk Review (advisory)\` workflow may have run a single-skeptic review — look for a review comment on this PR. If this PR carries no review comment at all, then nothing reviewed it.\n\n**To send it to the panel:** add the \`deep-review\` label to this PR. The panel is opt-in rather than automatic on purpose — each run spawns 3 concurrent Opus lens agents from the shared Claude Max Agent SDK pool, which this repo exhausted on 2026-08-04 by running ~30 at once."

          if [ "$NOT_REVIEWED" = "true" ]; then
            printf '%b\n\n%b\n\n[Workflow run](%s)\n' "$BODY" "$HATCH" "$RUN_URL" > /tmp/verdict-summary.md
          else
            printf '%b\n\n[Workflow run](%s)\n' "$BODY" "$RUN_URL" > /tmp/verdict-summary.md
          fi

          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --rawfile summary /tmp/verdict-summary.md \
            '{name:"Deep review status", head_sha:$sha, status:"completed",
              conclusion:$conclusion, output:{title:$title, summary:$summary}}' \
            > /tmp/check-run.json

          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/check-run.json > /dev/null
          echo "::notice::Published check run 'Deep review status' = $CONCLUSION — $TITLE"

          # ---- Unmissable channel: a PR comment, but only while it is true. ----
          # Marker is distinct from the panel's own `<!-- claude-deep-review-sdk -->`
          # (that one dedups on an exact prefix ending in a space, so these two
          # never collide).
          MARKER='<!-- claude-deep-review-sdk:verdict -->'
          # Plain read loop rather than `mapfile`, and indexed access rather
          # than "${IDS[@]}", so this is safe on bash 3 and under `set -u` with
          # an empty array — which is also what makes it runnable outside CI.
          IDS=()
          while IFS= read -r id; do
            [ -n "$id" ] && IDS+=("$id")
          done < <(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null || true)
          COUNT=${#IDS[@]}

          if [ "$NOT_REVIEWED" != "true" ]; then
            # Reviewed now — retract any stale "not reviewed" note so the PR
            # never carries a claim that has stopped being true.
            i=0
            while [ "$i" -lt "$COUNT" ]; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/${IDS[$i]}" > /dev/null 2>&1 \
                && echo "::notice::Retracted stale not-reviewed comment #${IDS[$i]}" || true
              i=$((i+1))
            done
            exit 0
          fi

          {
            printf '%s\n' "$MARKER"
            printf '## ⚪ This PR was NOT deep-reviewed\n\n'
            cat /tmp/verdict-summary.md
          } > /tmp/verdict-comment.md

          if [ "$COUNT" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/verdict-comment.md
            echo "::notice::Posted not-reviewed notice"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${IDS[0]}" -F body=@/tmp/verdict-comment.md > /dev/null
            echo "::notice::Updated not-reviewed notice #${IDS[0]}"
            i=1
            while [ "$i" -lt "$COUNT" ]; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/${IDS[$i]}" > /dev/null 2>&1 || true
              i=$((i+1))
            done
          fi
