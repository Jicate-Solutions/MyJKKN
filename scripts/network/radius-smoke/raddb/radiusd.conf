# Minimal FreeRADIUS 3.2 config for the MyJKKN RADIUS smoke harness.
# Rendered from scripts/network/radius-smoke/raddb/ by run.sh — the @@…@@
# placeholders are substituted at run time. Nothing here is production config.

prefix = @@PREFIX@@
exec_prefix = ${prefix}
libdir = ${prefix}/lib
confdir = @@CONFDIR@@
run_dir = @@RUNDIR@@
logdir = @@LOGDIR@@
name = radiusd
pidfile = ${run_dir}/${name}.pid

max_request_time = 30
cleanup_delay = 5
max_requests = 256
hostname_lookups = no

log {
	destination = stdout
	colourise = no
	stripped_names = no
	auth = yes
	auth_badpass = no
	auth_goodpass = no
}

security {
	max_attributes = 200
	reject_delay = 0
	status_server = no
}

$INCLUDE clients.conf

thread pool {
	start_servers = 2
	max_servers = 4
	min_spare_servers = 1
	max_spare_servers = 3
	max_requests_per_server = 0
	auto_limit_acct = no
}

modules {
	$INCLUDE mods-enabled/
}

instantiate {
}

$INCLUDE sites-enabled/
