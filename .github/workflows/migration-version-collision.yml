name: Migration version collision

# One check: a PR may not introduce a NEW duplicate 14-digit migration version.
#
# WHY this is a CI guard and not a database constraint: the constraint already
# exists and is the problem. `supabase db push` (see supabase-migration-apply.yml)
# records applied files in supabase_migrations.schema_migrations keyed on the
# filename's version token, and that column is the PRIMARY KEY. The second file to
# arrive at a duplicate version is not rejected loudly — it is treated as ALREADY
# APPLIED and skipped. The apply job goes green, the ledger reports success, and
# the SQL never runs. The defect surfaces weeks later as a missing function.
#
# Measured on jicate/main 2026-08-01: four files shared 20260808110000, authored by
# four different PRs that had each independently computed "one tick after the
# newest version on main".
#
# 🛑 BASELINE-AWARE ON PURPOSE. main carries 283 duplicate version groups across
# 2,177 migration files — 830 files, 38% of them, sit inside one, and the worst
# single version (20260725) has 16. A full-repo duplicate check would fail EVERY
# pull request from its first run — including PRs touching no SQL — and would be
# reverted the same day, leaving the class of bug unguarded again. The script
# therefore compares only what the PR adds against the base branch and is silent
# about the historical backlog. `--all` audits the backlog on demand and is
# deliberately NOT wired in here. Read the header of
# scripts/ci/check-migration-version-collision.mjs before tightening this — in
# particular, the version is the token before the first underscore, NOT the
# leading 14 digits; 522 live migrations use the short YYYYMMDD_ form.
#
# NOTE the workflow `name:` and the job `name:` are the status-check identity that
# branch protection matches on. If this check is ever made required, renaming
# either string silently orphans the rule pointing at the old name.
#
# Sibling of .github/workflows/table-anon-revoke.yml and secdef-anon-revoke.yml.
# Kept as a SEPARATE workflow on purpose so it reports as its own status check and
# cannot change the pass/fail meaning of an existing one.
#
# The `audit` job below does not cover this: two PRs open simultaneously, each
# adding the same brand-new version. Neither branch contains the other's file, so
# both pass; the loser reds only once its checks re-run against the updated main
# tip. That hole is what the SECOND job, `cross-pr`, closes — it asks the GitHub
# API which versions other OPEN pull requests are claiming. It is a separate job
# on purpose: its own status-check name, its own pass/fail meaning, and it fails
# OPEN on an API outage so a GitHub incident cannot red every build (see the
# script header for the full justification).
#
# Measured 2026-08-11, with `audit` green on every one of them: 20260810120000 was
# claimed by #2959, by #2961 AND by a file already on main; 20260817000000 was
# claimed by #2936 and #2945. `cross-pr` reports all of them.
#
# ─── THE THIRD JOB, AND WHY IT WAS MISSING ───────────────────────────────────
#
# `cross-pr` fails OPEN by design, and a fail-open guard is the one shape that
# can rot completely invisibly: a guard that skips on every run looks, from the
# checks UI, exactly like a guard that keeps passing. Its 20 regression cases in
# __tests__/ci/check-migration-version-cross-pr.test.ts exist precisely to police
# that — they assert the WORDING of the skip path, not just its exit code.
#
# Those 20 cases were never executed by CI. Verified on jicate/main at 1dacf18d
# (2026-09-03): `grep -rn check-migration-version-cross-pr.test .github/` returned
# nothing. This repository has no blanket vitest run — every workflow that runs
# vitest names its files by exact path (see the header of
# notification-link-preview-guards.yml, which was written after a guard shipped
# under __tests__/ci/ that nothing ran) — so a test file nobody names is dead
# code. The sibling workflow migration-rename-applied.yml already does this
# correctly and states the reason: "A guard whose logic is never executed is a
# guard that has quietly stopped guarding."
#
# `guard-tests` below closes that. It is a SEPARATE job, not a step inside
# `cross-pr`, for the same reason this whole file is a separate workflow: a
# broken guard and a real collision are different facts and must not share one
# status check. It also keeps `npm ci` off the two guard jobs, which need only
# bash, node and `gh`.
#
# The `paths:` filter gained two entries for the same class of reason. It
# previously did not name this workflow file or the test file, so a pull request
# that deleted the `cross-pr` job — or deleted its tests — did not trigger the
# workflow and left no evidence in the checks UI. A guard should witness its own
# removal. migration-rename-applied.yml already lists both; this now matches.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/ci/check-migration-version-collision.mjs'
      - 'scripts/ci/check-migration-version-cross-pr.sh'
      - '__tests__/ci/check-migration-version-cross-pr.test.ts'
      - '.github/workflows/migration-version-collision.yml'

permissions:
  contents: read
  # Read-only. Required by the `cross-pr` job to enumerate open pull requests and
  # their changed files. It grants nothing the `audit` job can act on.
  pull-requests: read

jobs:
  audit:
    name: No new duplicate migration versions
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout PR head (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run guard
        run: node scripts/ci/check-migration-version-collision.mjs --base "origin/${{ github.base_ref }}"

  cross-pr:
    name: No sibling PR claims the same migration version
    runs-on: ubuntu-latest
    # One GraphQL sweep of all open PRs plus one REST call per PR that touches
    # supabase/migrations/. Measured ~40 s against 94 open PRs, 40 of them
    # carrying migrations. The ceiling is generous because the cost scales with
    # how many PRs are open, which is not under this workflow's control.
    timeout-minutes: 10

    steps:
      - name: Checkout PR head (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run cross-PR guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-migration-version-cross-pr.sh --base "origin/${{ github.base_ref }}"

  guard-tests:
    name: Migration version guards' own tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Drives the REAL script as a subprocess against a fixture standing in for
      # the GitHub API and the base branch, so every verdict — pass, collision,
      # rename, and each of the four fail-open skip paths — is exercised with no
      # credentials and no network. Runs on forks and on PRs that add no
      # migration, which is the point: the decision logic must be executed even
      # when there is nothing to decide.
      - name: Test the cross-PR guard
        run: npx vitest run __tests__/ci/check-migration-version-cross-pr.test.ts
